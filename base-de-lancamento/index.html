<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base de Lançamento · Experimenta João</title>
<meta name="description" content="Jogo de Física do 1º ano do Prof. ExperimentaJoão: monte foguetes, pilote naves e aprenda leis de Newton, impulso, quantidade de movimento, gravitação e hidrostática.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: jogo de missão espacial para o 1º ano, animado e claro
   IDEA: base de lançamento; o aluno monta o foguete no hangar e pilota; cada missão é uma aula
   PICTURE: janela de voo grande com a nave pilotável; Prof. ExperimentaJoão fala em balões
   COLOUR: concreto claro, laranja de segurança, amarelo do jaleco; espaço escuro só no voo
   TYPE: Chakra Petch títulos e números, Nunito Sans texto; LAYOUT: coluna única até 1000px */
:root{color-scheme:light dark;--bg:light-dark(#eef0f2,#121519);--card:light-dark(#fff,#1b2027);--ink:light-dark(#14181d,#eef1f4);--mut:light-dark(#5a6470,#9aa5b1);--line:light-dark(#d5dae0,#2c333c);--lar:#ff5a1f;--lar2:light-dark(#c63d0b,#ff8a5c);--ama:#f2c21b;--ok:light-dark(#137a43,#4fd18b);--okbg:light-dark(#e3f5ea,#123222);--bad:light-dark(#b3261e,#ff8a80);--badbg:light-dark(#fdecea,#3a1715)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Chakra Petch",system-ui,sans-serif;line-height:1.1;margin:0}
h1{font-size:clamp(22px,4vw,30px)}h2{font-size:clamp(20px,3.4vw,26px)}h3{font-size:18px}
header{display:flex;align-items:center;gap:12px;padding:12px max(4vw,14px);background:var(--card);border-bottom:3px solid var(--lar)}
.volta-site{margin-left:auto;font:700 14px "Nunito Sans",sans-serif;color:var(--lar2);text-decoration:none;border:2px solid var(--lar);border-radius:99px;padding:5px 12px;white-space:nowrap}@media(max-width:520px){.volta-site{display:none}}
header .medal{font:700 15px "Chakra Petch";background:var(--ama);color:#3a2d00;padding:6px 12px;border-radius:99px;white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:16px max(3vw,12px) 40px}
#comms{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
#prof{width:clamp(88px,16vw,140px);flex:none}
.balao{position:relative;flex:1;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:12px 16px;margin-bottom:26px;min-height:90px}
.balao::before{content:"";position:absolute;left:-14px;bottom:22px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}
.balao::after{content:"";position:absolute;left:-10px;bottom:24px;border:10px solid transparent;border-right-color:var(--card);border-left:0}
.balao .quem{font:700 14px "Chakra Petch";color:var(--lar2)}
.balao p{margin:4px 0 10px;font-size:17px}
.formula{font:700 clamp(17px,3vw,21px) "Chakra Petch";background:#fff7d6;color:#3a2d00;border-radius:10px;padding:6px 12px;display:inline-block;margin:0 0 10px}
.bts{display:flex;gap:8px;flex-wrap:wrap}
button{font:700 16px "Nunito Sans",sans-serif;min-height:44px;padding:8px 16px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation}
button.pri{background:var(--lar);border-color:var(--lar);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--ama);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.setor{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:160px}
.setor svg{width:60px;height:60px}.setor.on{border-color:var(--lar)}.setor small{color:var(--mut)}
.tag{font:700 12px "Chakra Petch";padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mut);align-self:flex-start}
.missao{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;width:100%;text-align:left;margin-bottom:10px}
.missao .n{font:700 22px "Chakra Petch";width:44px;height:44px;border-radius:12px;background:var(--ama);color:#3a2d00;display:grid;place-items:center;flex:none}
.missao .st{margin-left:auto;font-size:20px;color:var(--ama);white-space:nowrap;letter-spacing:2px}
.voo{background:#050913;border-radius:16px;overflow:hidden;position:relative;height:clamp(300px,52vw,470px);touch-action:none}
.voo canvas{position:absolute;inset:0;width:100%;height:100%}
.pad{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px;margin-top:10px}
.pad button{min-height:64px;font-size:18px;user-select:none;-webkit-user-select:none}
.pad .ign{background:var(--lar);border-color:var(--lar);color:#fff;font-family:"Chakra Petch"}
.pad .ign.on{background:#ffb02e;border-color:#ffb02e;color:#3a2d00}
.prog{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.prog label{display:flex;flex-direction:column;font-weight:700;font-size:14px}
input[type=text]{font:700 18px "Chakra Petch";width:120px;min-height:44px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.teclas{font-size:13px;color:var(--mut);margin:8px 0 0}
.hang{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.peca{font-weight:700;font-size:14px;color:var(--mut);margin:12px 0 6px}
.ops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.op{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 10px;border:2px solid var(--line);border-radius:12px;min-height:84px;font-weight:400;font-size:14px}
.op b{font:700 16px "Chakra Petch"}.op.sel{border-color:var(--lar);background:light-dark(#fff1ea,#3a1d12)}
.op .c{color:var(--lar2);font-weight:700}
.ficha{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;align-self:start}
.ficha svg{width:100%;height:150px}
.lin{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.lin span{color:var(--mut);font-size:14px}.lin b{font:700 17px "Chakra Petch";white-space:nowrap}
.lin.big b{color:var(--lar2);font-size:20px}
.orc{font:700 15px "Chakra Petch";margin-top:8px}.orc.no{color:var(--bad)}
.q{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.q.ok{border-color:var(--ok);background:var(--okbg)}.q.no{border-color:var(--bad);background:var(--badbg)}
.q label{display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer}.q input{width:20px;height:20px}
.err{color:var(--bad);font-size:14px;min-height:18px}
.fase{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.fase span{font:700 13px "Chakra Petch";padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.fase span.at{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.voltar{background:none;border:0;color:var(--lar2);padding:0;min-height:36px}
.medalha{text-align:center;background:var(--card);border:2px solid var(--ama);border-radius:18px;padding:24px}
.medalha svg{width:100px;height:100px}.estrelas{font-size:40px;color:var(--ama);letter-spacing:6px}
@media (prefers-reduced-motion:no-preference){#olhos{animation:pisca 4.5s infinite;transform-origin:70px 60px}}
@keyframes pisca{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media(max-width:700px){.hang{grid-template-columns:1fr}.ficha svg{height:110px}}
@media(max-width:600px){.balao p{font-size:16px}#comms{align-items:flex-start}.balao{margin-bottom:0}.balao::before,.balao::after{bottom:auto;top:28px}.op{min-height:96px;font-size:13px}.teclas{display:none}}
.sub{color:var(--mut);margin:4px 0 12px}
.ic{font-size:28px}
.pad button.on:not(.ign),#sp.on,#sr.on{background:var(--ama);border-color:var(--ama);color:#3a2d00}
.thr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.thr label{flex:1 1 200px;display:flex;flex-direction:column;font-weight:700;font-size:14px}
.thr label b{font:700 22px "Chakra Petch";color:var(--lar2)}
.thr input[type=range]{width:100%;height:36px;accent-color:#ff5a1f}
.thr .ic{width:56px;min-height:56px}
.slots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.slot{min-height:52px;padding:4px;font:700 16px "Chakra Petch"}
#pp{width:140px}
</style>
</head>
<body>
<header><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 2c6 5 8 12 7 20H10C9 14 11 7 17 2z" fill="#ff5a1f"/><circle cx="17" cy="13" r="3" fill="#fff"/><path d="M10 22l-5 7h7zM24 22l5 7h-7z" fill="#f2c21b"/></svg><h1>Base de Lançamento</h1><a class="volta-site" href="../alunos.html">Área do Aluno</a><span class="medal" id="cont">★ 0</span></header>
<main>
<section id="comms" aria-live="polite">
<svg id="prof" viewBox="0 0 140 190" role="img" aria-label="Prof. ExperimentaJoão, careca, forte, de jaleco amarelo e headset">
<path d="M2 190C4 124 26 110 70 108C114 110 136 124 138 190Z" fill="#f2c21b" stroke="#8f6c00" stroke-width="2"/>
<path d="M52 110L70 150L88 110Z" fill="#2b3440"/><path d="M52 110L70 150L40 124ZM88 110L70 150L100 124Z" fill="#d9a90e"/>
<rect x="102" y="140" width="18" height="22" rx="3" fill="#d9a90e"/><rect x="105" y="133" width="3" height="11" fill="#1f6feb"/><rect x="111" y="135" width="3" height="9" fill="#e53935"/>
<rect x="12" y="146" width="62" height="13" rx="3" fill="#fff"/><text x="43" y="155.5" font-size="6.6" text-anchor="middle" font-family="Chakra Petch,sans-serif" font-weight="700" fill="#14181d">EXPERIMENTAJOÃO</text>
<path d="M54 84h32v26c-6 6-26 6-32 0z" fill="#a8683f"/>
<ellipse cx="35" cy="62" rx="7" ry="10" fill="#a0613a"/><ellipse cx="105" cy="62" rx="7" ry="10" fill="#a0613a"/>
<path d="M35 52C35 17 105 17 105 52C106 74 100 88 89 96C80 101 60 101 51 96C40 88 34 74 35 52Z" fill="#b5764b"/>
<path d="M41 78C45 92 56 99 70 99C84 99 95 92 99 78C95 86 84 90 70 90C56 90 45 86 41 78Z" fill="#5b3a26" opacity=".35"/>
<ellipse cx="58" cy="30" rx="14" ry="6" fill="#fff" opacity=".22"/>

<g id="olhos"><ellipse cx="56" cy="60" rx="4" ry="4.5" fill="#1b120c"/><ellipse cx="84" cy="60" rx="4" ry="4.5" fill="#1b120c"/></g>

<div class="balao"><div class="quem">Prof. ExperimentaJoão</div><p id="fala"></p><div id="extra"></div><div class="bts" id="bts"></div></div>
</section>
<section id="tela"></section>
</main>
<script>
{
const G=10;
const fmt=(x,d=0)=>Number(x).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const alt=(certa,erradas,pos)=>{const a=[...erradas];a.splice(pos,0,certa);return{a,c:pos}};
const $=s=>document.querySelector(s),tela=$('#tela');

/* ---------- Peças ---------- */
const MOT_ESP=[{n:'Faísca',F:2000,m:200,c:1},{n:'Trovão',F:4000,m:400,c:2},{n:'Vulcão',F:8000,m:800,c:4}];
const TAN_ESP=[{n:'Pequeno',t:6,m:100,c:1},{n:'Médio',t:12,m:300,c:2},{n:'Grande',t:20,m:600,c:3}];
const MOT_TOR=[{n:'Pardal',F:15000,m:300,c:1},{n:'Condor',F:30000,m:600,c:2},{n:'Fênix',F:60000,m:1200,c:4}];
const TAN_TOR=[{n:'Curto',t:10,m:200,c:1},{n:'Médio',t:20,m:500,c:2},{n:'Longo',t:40,m:1000,c:3}];
const MOT_POU=[{n:'Brisa',F:1200,m:0,c:1},{n:'Sopro',F:3000,m:0,c:2},{n:'Rajada',F:9000,m:0,c:3}];
const MOLAS=[{n:'Mola leve',I:300,c:1},{n:'Mola média',I:600,c:2},{n:'Mola forte',I:1200,c:3}];
const CABOS=[{n:'Fio leve',T:800,c:1},{n:'Cabo médio',T:1500,c:2},{n:'Cabo reforçado',T:3000,c:3}];
const BLOCOS=[{n:'Bloco P',m:800,c:1},{n:'Bloco M',m:1600,c:2},{n:'Bloco G',m:3200,c:3}];
const CARGAS=[{n:'A',m:100,cor:'#2f9e5b'},{n:'B',m:200,cor:'#1f6feb'},{n:'C',m:300,cor:'#ff5a1f'}];
const SLOTS=[-3,-2,-1,0,1,2,3];
const MUNDOS=[{n:'Terra',M:5.97e24,R:6.37e6},{n:'Marte',M:6.42e23,R:3.39e6},{n:'Lua',M:7.35e22,R:1.74e6}];
const GU=6.67e-11;MUNDOS.forEach(w=>w.g=GU*w.M/w.R**2);
const GM=1600,RP=100;
const CAPS=1000;

/* ---------- Setores ---------- */
const SETORES=[
 {id:'hangar',nome:'Hangar',temas:'Centro de massa e torque',ico:'<rect x="6" y="26" width="52" height="32" fill="#9aa5b1"/><path d="M4 28L32 8L60 28Z" fill="#5a6470"/><rect x="26" y="38" width="12" height="20" fill="#ff5a1f"/>'},
 {id:'torre',nome:'Torre de lançamento',temas:'Leis de Newton: peso, normal e tração',ico:'<path d="M14 58L22 6h6l8 52M18 30h16M16 44h20" stroke="#5a6470" stroke-width="3" fill="none"/><path d="M46 12c5 5 6 14 5 26h-10c-1-12 0-21 5-26z" fill="#ff5a1f"/><path d="M42 38l4 14 4-14z" fill="#f2c21b"/>'},
 {id:'voo',nome:'Voo e manobras',temas:'Impulso, quantidade de movimento e conservação',ico:'<path d="M50 14c-12 2-24 12-30 26l8 8c14-6 24-18 26-30z" fill="#ff5a1f"/><circle cx="40" cy="26" r="4" fill="#fff"/><path d="M20 40L8 46l10 4 4 10 6-12z" fill="#f2c21b"/>'},
 {id:'orbita',nome:'Órbita',temas:'Gravitação universal e leis de Kepler',ico:'<circle cx="32" cy="32" r="12" fill="#1f6feb"/><ellipse cx="32" cy="32" rx="28" ry="12" fill="none" stroke="#9aa5b1" stroke-width="2"/><circle cx="58" cy="30" r="4" fill="#ff5a1f"/>'}];

/* ---------- Missões ---------- */
const MISSOES=[
/* HANGAR */
{id:'carga',setor:'hangar',titulo:'Carga equilibrada',conceito:'Centro de massa',modo:'espaco',mont:'carga',ctrl:['ign'],
 briefing:['Bem-vindo ao Hangar, piloto! Hoje a nave vai levar três contêineres: A (100 kg), B (200 kg) e C (300 kg), presos numa viga atravessada.','O motor empurra pelo meio da nave. Se o peso ficar torto para um lado, a nave começa a girar sozinha quando você liga o motor.','Distribua a carga e depois voe em linha reta até o portal.'],
 aula:['O centro de massa é o ponto de equilíbrio de todas as massas juntas. É como se toda a massa estivesse ali.','Para achar a posição dele, cada massa conta mais quanto mais pesada e mais longe ela estiver: some m · x e divida pela massa total.','Se a força do motor não passa pelo centro de massa, ela cria um torque e a nave gira.'],
 formula:'x_cm = (m₁·x₁ + m₂·x₂ + ...) ÷ (m₁ + m₂ + ...)',
 dica:'A nave tem 1 000 kg no meio (x = 0). Coloque os contêineres de modo que a soma m · x dê zero. Exemplo: 300 kg em −1 m cancela 100 kg em +3 m.',
 perg:d=>[
  {p:`Na sua montagem, a soma de m · x dos contêineres deu ${fmt(d.soma)} kg·m. Com massa total de ${fmt(d.mt)} kg, onde ficou o centro de massa?`,...alt(fmt(d.soma/d.mt,2)+' m',[fmt(d.soma/1000,2)+' m',fmt(d.soma/600,2)+' m'],1)},
  {p:`Se o contêiner C (300 kg) fosse puxado 1 m para mais longe do centro, o centro de massa se deslocaria:`,...alt(fmt(300/d.mt,2)+' m para o lado dele',['nada, porque a nave é muito pesada','3 m para o lado dele'],0)},
  {p:'Por que a nave girou nos testes com a carga torta?',...alt('A força do motor não passava pelo centro de massa e criou um torque',['O motor estava fraco','A carga empurrou a nave para trás'],2)}]},
{id:'guindaste',setor:'hangar',titulo:'Guindaste do hangar',conceito:'Torque e equilíbrio',modo:'guindaste',mont:'bloco',ctrl:['pos'],
 briefing:['O estágio de 800 kg precisa subir até o foguete. O guindaste tem um braço que gira num pino no alto da torre.','O estágio fica pendurado a 4 m do pino. Do outro lado, um contrapeso desliza pelo braço.','Se o braço não estiver equilibrado, ele tomba quando o estágio sair do chão!'],
 aula:['Torque é a capacidade de uma força fazer algo girar. Depende da força e da distância até o pino.','Para o braço não girar, o torque de um lado precisa ser igual ao do outro.','Contrapeso leve tem que ficar longe do pino; contrapeso pesado fica perto.'],
 formula:'τ = F · d      equilíbrio: P₁ · d₁ = P₂ · d₂',
 dica:'Torque do estágio: 8 000 N × 4 m = 32 000 N·m. A distância do contrapeso é d₂ = 32 000 ÷ (peso do contrapeso).',
 perg:d=>[
  {p:'Qual é o torque que o estágio de 800 kg, a 4 m do pino, faz no braço do guindaste?',...alt('32.000 N·m',['3.200 N·m','12.000 N·m'],0)},
  {p:`Você escolheu um contrapeso de ${fmt(d.mb)} kg. A que distância do pino ele precisa ficar?`,...alt(fmt(32000/(d.mb*G),1)+' m',[fmt(32000/(d.mb*G)*2,1)+' m',fmt(d.mb/800,1)+' m'],2)},
  {p:`Com o braço em equilíbrio, qual força a torre faz para sustentar o estágio e o contrapeso (força normal no pino, sem contar o braço)?`,...alt(fmt((800+d.mb)*G)+' N',[fmt(Math.abs(800-d.mb)*G)+' N','zero, porque está em equilíbrio'],1)}]},
/* TORRE */
{id:'decolagem',setor:'torre',titulo:'Decolagem',conceito:'2ª lei de Newton, peso e normal',modo:'vertical',mont:'naveT',ctrl:['thr'],g:10,h0:0,v0:0,alvo:300,
 briefing:['Torre de lançamento, piloto! Agora tem gravidade: a Terra puxa o foguete para baixo com a força peso.','Sua missão é subir até 300 m de altura. Você controla a potência do motor de 0 a 100%.','Repare na plataforma: enquanto o foguete está parado nela, ela empurra o foguete para cima. Essa é a força normal.'],
 aula:['Peso é a força com que a Terra puxa o foguete: massa vezes a gravidade, P = m · g.','O foguete só sai do chão se a força do motor for maior que o peso. A diferença é a força resultante.','A 2ª lei de Newton diz que a aceleração é a força resultante dividida pela massa.'],
 formula:'P = m · g      R = F − P      a = R ÷ m',
 dica:'Calcule o peso da sua nave (m · 10). O motor precisa passar desse valor. Na montagem, confira se a força resultante ficou positiva.',
 perg:d=>[
  {p:`Seu foguete tinha ${fmt(d.m)} kg. Qual era o peso dele na Terra (g = 10 m/s²)?`,...alt(fmt(d.m*G)+' N',[fmt(d.m)+' N',fmt(d.m/G)+' N'],2)},
  {p:`Com o motor ${d.mo} a 100% (${fmt(d.F)} N), qual foi a aceleração do foguete na subida?`,...alt(fmt((d.F-d.m*G)/d.m,2)+' m/s²',[fmt(d.F/d.m,2)+' m/s²',fmt((d.F+d.m*G)/d.m,2)+' m/s²'],0)},
  {p:`Ainda na plataforma, com o motor a 50% (${fmt(d.F/2)} N), qual era a força normal da plataforma no foguete?`,...alt(d.F/2>=d.m*G?'0 N, o foguete já estava subindo':fmt(d.m*G-d.F/2)+' N',[fmt(d.m*G+d.F/2)+' N',fmt(d.m*G)+' N'],1)}]},
{id:'pouso',setor:'torre',titulo:'Pouso na Lua',conceito:'1ª lei de Newton',modo:'vertical',mont:'motorP',ctrl:['thr'],g:1.6,h0:150,v0:-6,m:1000,lua:true,
 briefing:['Missão lunar! Seu módulo de 1 000 kg está descendo a 6 m/s, a 150 m do chão da Lua.','A gravidade da Lua é bem menor: 1,6 m/s². Mesmo assim, se tocar o solo a mais de 2 m/s, o módulo quebra.','Escolha o motor certo e controle a potência para pousar suave.'],
 aula:['A 1ª lei de Newton diz: se a força resultante é zero, a velocidade não muda.','Então, se o motor empurrar exatamente com a força do peso, o módulo desce com velocidade constante.','Mais força que o peso, ele freia. Menos força que o peso, ele acelera para baixo.'],
 formula:'R = 0  →  v constante      P = m · g',
 dica:'O peso na Lua é 1 000 × 1,6 = 1 600 N. Escolha um motor mais forte que isso. Freie no começo e, perto do chão, deixe o motor perto de 1 600 N para descer devagar e constante.',
 perg:d=>[
  {p:'Qual era o peso do módulo de 1 000 kg na Lua?',...alt('1.600 N',['10.000 N','1.000 N'],0)},
  {p:`Para o módulo descer com velocidade constante, em que potência o motor ${d.mo} (${fmt(d.F)} N) precisava ficar?`,...alt(fmt(1600/d.F*100,0)+'%',['100%',fmt(Math.min(99,1600/d.F*200),0)+'%'],2)},
  {p:'Quando a força do motor ficou igual ao peso, o que aconteceu com a velocidade de descida?',...alt('Ficou constante, porque a força resultante era zero',['Parou na hora','Aumentou sem parar'],1)}]},
{id:'reboque',setor:'torre',titulo:'Reboque de satélite',conceito:'Tração e 3ª lei de Newton',modo:'reboque',mont:'cabo',ctrl:['thr'],
 briefing:['Missão de reboque! Seu rebocador de 1 000 kg vai puxar um satélite de 500 kg com um cabo.','Você precisa levar o satélite até 6 m/s. Mas atenção: se a tração no cabo passar do limite, ele arrebenta.','Escolha o cabo na montagem e controle a potência do motor.'],
 aula:['Tração é a força que um cabo esticado faz nos corpos presos a ele.','O cabo puxa o satélite para a frente e puxa o rebocador para trás com a mesma força. É a 3ª lei de Newton: ação e reação.','O cabo só precisa acelerar o satélite: T = m_satélite · a. E a aceleração do conjunto é a = F ÷ (m₁ + m₂).'],
 formula:'a = F ÷ (m₁ + m₂)      T = m₂ · a',
 dica:'Com o motor a F, a tração é T = 500 × F ÷ 1 500 = F ÷ 3. Mantenha F abaixo de 3 vezes o limite do cabo.',
 perg:d=>[
  {p:'Com o motor a 3.000 N, qual é a aceleração do conjunto rebocador (1 000 kg) mais satélite (500 kg)?',...alt('2 m/s²',['3 m/s²','6 m/s²'],1)},
  {p:`O seu cabo aguentava ${fmt(d.Tm)} N. Qual era a maior força de motor que você podia usar sem arrebentar o cabo?`,...alt(fmt(Math.min(4000,d.Tm*3))+' N',[fmt(d.Tm)+' N',fmt(d.Tm*1.5)+' N'],0)},
  {p:'Enquanto o cabo puxava o satélite para a frente, o que ele fazia com o rebocador?',...alt('Puxava o rebocador para trás com a mesma força',['Empurrava o rebocador para a frente','Nada, o cabo só age no satélite'],2)}]},
/* VOO */
{id:'queima',setor:'voo',titulo:'Alcance o comboio',conceito:'Impulso',modo:'espaco',mont:'nave',orc:4,pede:10,ctrl:['girar','ign','prog'],
 briefing:['Bem-vindo à base, piloto! Eu sou o Prof. ExperimentaJoão. Hoje você monta a sua nave e pilota de verdade.','O comboio de suprimentos vai passar a 10 m/s. Sua nave está parada. Você precisa emparelhar com ele, na mesma velocidade, por 2 segundos.','Longe dos planetas quase não tem gravidade nem ar. Só o motor muda o movimento da nave.'],
 aula:['Quando o motor empurra a nave durante um tempo, ele dá um impulso: força vezes tempo.','O impulso vira quantidade de movimento. Dividindo pela massa, você descobre quanto a velocidade muda.','Na montagem, escolha uma nave que consiga pelo menos 10 m/s sem estourar o orçamento.'],
 formula:'I = F · Δt      Δv = I ÷ m',
 dica:'Para chegar a 10 m/s, divida: Δt = m · 10 ÷ F. Segure a ignição só esse tempo, ou use a queima programada.',
 perg:d=>[
  {p:`No seu voo, a nave de ${fmt(d.m)} kg recebeu um impulso total de ${fmt(d.I)} N·s. Qual foi a variação de velocidade (Δv = I ÷ m)?`,...alt(fmt(d.I/d.m,1)+' m/s',[fmt(d.I/d.m*2,1)+' m/s',fmt(d.I/d.m/2,1)+' m/s'],1)},
  {p:`Seu motor ${d.mo} faz ${fmt(d.F)} N. Quanto tempo ele precisa ficar ligado para essa nave de ${fmt(d.m)} kg ganhar 10 m/s?`,...alt(fmt(d.m*10/d.F,2)+' s',[fmt(d.m*20/d.F,2)+' s',fmt(d.m*5/d.F,2)+' s'],2)},
  {p:'Enquanto o motor estava ligado com a nave apontada para a direita, o que aconteceu com a seta verde (v)?',...alt('Cresceu para a direita, porque o impulso foi nesse sentido',['Ficou do mesmo tamanho, porque a força não muda a velocidade','Apontou para a esquerda, contra a força'],0)}]},
{id:'freio',setor:'voo',titulo:'Chegada suave',conceito:'Quantidade de movimento',modo:'espaco',mont:'nave',orc:4,pede:8,ctrl:['girar','ign','prog'],
 briefing:['Missão de acoplamento! Sua nave vem a 8 m/s na direção da estação.','Se encostar a mais de 1 m/s, bate. Você precisa virar a nave de costas e frear com o motor.','Atenção: girar a nave não freia nada. Só o impulso do motor muda a velocidade.'],
 aula:['Todo corpo em movimento tem quantidade de movimento: massa vezes velocidade.','Ela é um vetor. Para frear, o impulso tem que apontar no sentido contrário ao movimento.','Para parar, o impulso precisa ser igual à quantidade de movimento da nave.'],
 formula:'Q = m · v      parar: F · Δt = Q',
 dica:'Gire até a nave ficar de costas para a estação (a seta verde da velocidade aponta para o motor). Depois queime Δt = m · 8 ÷ F.',
 perg:d=>[
  {p:`Sua nave de ${fmt(d.m)} kg chegou a 8 m/s. Qual era a quantidade de movimento dela antes de frear?`,...alt(fmt(d.m*8)+' kg·m/s',[fmt(d.m/8,1)+' kg·m/s',fmt(d.m+8)+' kg·m/s'],0)},
  {p:'Você girou a nave de costas antes de ligar o motor. Por que só girar não freou a nave?',...alt('Sem força não há impulso, e a velocidade continua igual (1ª lei de Newton)',['Porque o motor estava fraco demais','Porque a estação puxava a nave'],1)},
  {p:`Seu retrofoguete de ${fmt(d.F)} N precisava cancelar ${fmt(d.m*8)} kg·m/s. Quanto tempo de queima isso exige?`,...alt(fmt(d.m*8/d.F,2)+' s',[fmt(d.m*16/d.F,2)+' s',fmt(d.m*4/d.F,2)+' s'],2)}]},
{id:'desvio',setor:'voo',titulo:'Desvio do asteroide',conceito:'Impulso é um vetor',modo:'espaco',mont:'nave',orc:3,pede:4,ctrl:['girar','ign','prog'],
 briefing:['Alerta! Um asteroide está bem na sua rota. Você vem a 6 m/s para a direita.','Desvie e passe pelo portal de chegada sem sair do corredor amarelo.','Pense na direção do impulso: empurrar para frente ou para trás não tira a nave da frente da pedra.'],
 aula:['O impulso tem direção. Ele muda a velocidade na direção em que o motor empurra.','Um empurrão de lado cria uma velocidade de lado, e a nave passa a andar na diagonal.','Pela 1ª lei de Newton, sem força a nave segue reto. Girar sem ligar o motor não muda a trajetória.'],
 formula:'Δv = F · Δt ÷ m   (na direção do empurrão)',
 dica:'Gire a nave 90° para cima, dê uma queima curta e depois apague o motor. A nave vai andar na diagonal e passar por cima da pedra.',
 perg:d=>[
  {p:'Para desviar, você apontou o motor para o lado e queimou. O que aconteceu com a trajetória da nave?',...alt('Ganhou velocidade de lado e passou a andar na diagonal',['Parou de andar para a frente','Ficou mais lenta para a frente e continuou reta'],0)},
  {p:`Você terminou com ${fmt(d.vx,1)} m/s para a frente e ${fmt(Math.abs(d.vy),1)} m/s de lado. A velocidade para a frente mudou durante a queima de lado?`,...alt('Quase nada, porque o impulso foi perpendicular ao movimento',['Sim, dobrou','Sim, foi a zero'],1)},
  {p:`Sua nave de ${fmt(d.m)} kg ganhou ${fmt(Math.abs(d.vy),1)} m/s de lado. Qual foi o impulso lateral (I = m · Δv)?`,...alt(fmt(d.m*Math.abs(d.vy))+' N·s',[fmt(d.m*Math.abs(d.vy)*2)+' N·s',fmt(d.m/Math.max(.1,Math.abs(d.vy)))+' N·s'],2)}]},
{id:'estagios',setor:'voo',titulo:'Separação de estágios',conceito:'Conservação da quantidade de movimento',modo:'espaco',mont:'mola',orc:3,m1:600,m2:200,ctrl:['girar','sep'],
 briefing:['Pane no motor! Sua cápsula, de 200 kg, ainda está presa a um estágio vazio de 600 kg, parada no espaço.','A única saída é soltar o estágio com molas. A estação de resgate fica a 60 m e o resgate sai em 30 segundos.','Se a cápsula chegar a mais de 5 m/s, bate na estação. Escolha a mola certa e mire bem.'],
 aula:['Quando só agem forças internas, como as molas entre as partes, a quantidade de movimento total se conserva.','Antes estava tudo parado, Q total = 0. Depois, as duas partes saem em sentidos opostos com quantidades de movimento iguais.','A mola dá o mesmo impulso às duas partes. A parte mais leve sai mais rápida.'],
 formula:'v₂ = I ÷ m₂      m₁ · v₁ = m₂ · v₂',
 dica:'Velocidade da cápsula = impulso da mola ÷ 200 kg. Ela precisa de mais de 2 m/s para chegar em 30 s e de menos de 5 m/s para não bater. Gire para mirar na estação antes de soltar.',
 perg:d=>[
  {p:`A mola que você escolheu deu ${fmt(d.Im)} N·s de impulso. Com que velocidade a cápsula de 200 kg saiu?`,...alt(fmt(d.Im/200,1)+' m/s',[fmt(d.Im/600,1)+' m/s',fmt(d.Im/800,1)+' m/s'],1)},
  {p:'E o estágio de 600 kg, que foi para trás, saiu com que velocidade?',...alt(fmt(d.Im/600,1)+' m/s',[fmt(d.Im/200,1)+' m/s','0 m/s, porque ele é pesado'],0)},
  {p:'Somando a quantidade de movimento da cápsula e a do estágio depois da separação, o resultado foi:',...alt('zero, igual a antes da separação',['o dobro do impulso da mola','igual só à quantidade de movimento da cápsula'],2)}]},
/* ÓRBITA */
{id:'pairar',setor:'orbita',titulo:'Pairar em outro mundo',conceito:'Gravitação universal: g = G·M ÷ R²',modo:'vertical',mont:'mundo',ctrl:['thr'],h0:0,v0:0,m:500,Fm:4000,
 briefing:['Setor Órbita! Antes de dar a volta num planeta, vamos entender a gravidade de cada mundo.','Seu módulo tem 500 kg e um motor de no máximo 4 000 N. A missão: subir e ficar parado no ar, entre 40 m e 60 m, por 5 segundos.','Você escolhe o mundo: Terra, Marte ou Lua. E programa a potência que acha que vai segurar o módulo no ar.'],
 aula:['Newton descobriu que todos os corpos se atraem. A atração depende das massas e da distância.','Na superfície de um planeta, a gravidade é g = G · M ÷ R², em que M é a massa do planeta e R é o raio.','Para pairar, a força do motor tem que ser igual ao peso: F = m · g.'],
 formula:'g = G · M ÷ R²      pairar: F = m · g',
 dica:'Calcule o peso do módulo no mundo escolhido (500 × g) e divida pela força máxima (4 000 N). Esse é o percentual para pairar. Suba com mais potência e depois ajuste.',
 perg:d=>[
  {p:`Você escolheu ${d.mundo}, com g = ${fmt(d.g,2)} m/s². Qual era o peso do módulo de 500 kg lá?`,...alt(fmt(500*d.g)+' N',[fmt(500/d.g)+' N','500 N'],1)},
  {p:`Qual potência do motor de 4 000 N segura o módulo parado em ${d.mundo}?`,...alt(fmt(500*d.g/4000*100,0)+'%',[fmt(Math.min(99,500*d.g/4000*200),0)+'%','100%'],0)},
  {p:'Por que o mesmo módulo não consegue pairar na Terra com esse motor?',...alt('Porque o peso na Terra (4 900 N) é maior que a força máxima do motor',['Porque na Terra não existe gravidade','Porque o motor funciona pior com ar'],2)}]},
{id:'orbita1',setor:'orbita',titulo:'Primeira órbita',conceito:'Gravitação e órbita circular',modo:'orbita',mont:'orb',ctrl:['girar','ign','sas'],
 briefing:['Hora de dar a volta num mundo! Você está sobre a pequena lua Pequi, de 100 m de raio, a 50 m de altitude.','Sua nave vai de lado a 2 m/s, devagar demais: se não fizer nada, ela cai. Ganhe velocidade para entrar em órbita e dê uma volta completa.','O tempo aqui passa 10 vezes mais rápido, para a volta não demorar.'],
 aula:['Em órbita, a nave está sempre caindo em direção ao planeta, mas anda tão rápido de lado que nunca chega ao chão.','A gravidade é a força que puxa a nave para o centro e faz ela fazer a curva.','A velocidade de órbita circular depende da massa do planeta e da distância ao centro.'],
 formula:'v_órbita = √(G · M ÷ r)',
 dica:'Aqui G · M = 1 600 e r = 150 m: v = √(1 600 ÷ 150) ≈ 3,3 m/s. Aponte a nave para a frente (botão Prógrado) e queime até a velocidade chegar perto de 3,3 m/s.',
 perg:d=>[
  {p:'Com G · M = 1 600 e a nave a r = 150 m do centro, qual a velocidade de órbita circular?',...alt('3,3 m/s',['10,7 m/s','1,6 m/s'],2)},
  {p:'O que mantém a nave em órbita depois que o motor desliga?',...alt('A gravidade puxando para o centro, enquanto a nave anda de lado',['O motor continua empurrando escondido','Não existe gravidade no espaço'],0)},
  {p:`Sua órbita variou entre ${fmt(d.rmin)} m e ${fmt(d.rmax)} m do centro. Se a nave estivesse mais longe do planeta, a velocidade de órbita seria:`,...alt('menor',['maior','a mesma'],1)}]},
{id:'kepler',setor:'orbita',titulo:'Órbita alta',conceito:'Leis de Kepler',modo:'orbita',mont:'orb',ctrl:['girar','ign','sas'],
 briefing:['Você já está em órbita circular a 150 m do centro da Pequi. Um satélite espera numa órbita maior, de 300 m.','Dê uma queima para a frente e transforme sua órbita numa elipse que encosta na órbita do satélite.','Repare nas fatias coloridas que a nave desenha: elas mostram a 2ª lei de Kepler.'],
 aula:['1ª lei de Kepler: as órbitas são elipses, e o planeta fica num dos focos.','2ª lei: a linha do planeta até a nave varre áreas iguais em tempos iguais. Perto do planeta a nave anda mais rápido; longe, mais devagar.','3ª lei: quanto maior a órbita, maior o tempo de uma volta. O quadrado do período é proporcional ao cubo do raio.'],
 formula:'T² ∝ r³      perto: mais rápido; longe: mais devagar',
 dica:'Use o botão Prógrado e queime pouco, cerca de 0,5 m/s. Veja a linha tracejada: quando o ponto mais distante tocar o anel do satélite, desligue o motor.',
 perg:d=>[
  {p:`No seu voo, a nave passou a ${fmt(d.vp,2)} m/s no ponto mais próximo e a ${fmt(d.va,2)} m/s no ponto mais distante. Qual lei de Kepler explica essa diferença?`,...alt('2ª lei: áreas iguais em tempos iguais, mais rápida perto do planeta',['1ª lei: órbitas circulares','3ª lei: órbitas maiores são mais rápidas'],1)},
  {p:'Uma órbita com o dobro do raio tem período quantas vezes maior (T² ∝ r³)?',...alt('cerca de 2,8 vezes',['2 vezes','8 vezes'],2)},
  {p:'Em que formato ficou a sua órbita depois da queima?',...alt('Uma elipse, com o planeta num dos focos',['Um círculo perfeito','Uma linha reta'],0)}]}
];

MISSOES.push(
{id:'atoleiro',setor:'planeta',titulo:'Atoleiro',conceito:'Pressão em sólidos: p = F ÷ A',modo:'rover',mont:'pneu',ctrl:['mover'],
 briefing:['Pouso confirmado no Planeta Urucuia! Aqui a gravidade é 4 m/s², menos da metade da Terra, e o ar é bem rarefeito.','Seu rover tem 600 kg e precisa atravessar um areal fofo até a base. A areia só aguenta uma pressão de 7 000 Pa. Mais que isso, o rover afunda.','E cuidado: com gravidade baixa, as rodas escorregam e o rover pula alto nas pedras.'],
 aula:['Pressão é força dividida pela área em que ela se apoia.','A mesma força espalhada numa área maior faz menos pressão. É por isso que o pé de pato não afunda na lama e a faca afiada corta.','Aqui a força é o peso do rover: P = m · g, com g = 4 m/s².'],
 formula:'p = F ÷ A      P = m · g',
 dica:'Peso do rover: 600 × 4 = 2 400 N. Some a área dos 4 pneus e divida: a pressão precisa ficar em até 7 000 Pa.',
 perg:d=>[
  {p:`Com os pneus ${d.pneu} (4 × ${fmt(d.A,2)} m²), qual foi a pressão do rover de 2 400 N na areia?`,...alt(fmt(2400/(4*d.A))+' Pa',[fmt(2400*4*d.A)+' Pa',fmt(600/(4*d.A))+' Pa'],1)},
  {p:'Se esse mesmo rover andasse na Terra (g = 10 m/s²), com os mesmos pneus, a pressão na areia seria:',...alt('2,5 vezes maior, porque o peso seria 6 000 N',['a mesma, porque a massa não muda','menor, porque a Terra tem ar'],0)},
  {p:'Por que pneus mais largos impediram o rover de afundar?',...alt('Espalham o mesmo peso numa área maior e diminuem a pressão',['Deixam o rover mais leve','Aumentam a gravidade do planeta'],2)}]},
{id:'lagoa',setor:'planeta',titulo:'Lagoa em camadas',conceito:'Densidade e empuxo (Arquimedes)',modo:'densidade',mont:'sonda',ctrl:['lastro'],
 briefing:['Achamos uma lagoa com três líquidos que não se misturam: óleo em cima, água no meio e salmoura no fundo.','Precisamos de uma amostra bem na fronteira entre a água e a salmoura. Sua sonda tem que afundar no óleo e na água, mas parar em cima da salmoura.','Você escolhe o tamanho da sonda e ajusta o lastro, que é a massa dela.'],
 aula:['Densidade é massa dividida pelo volume: d = m ÷ V. Ela diz o quanto a matéria está concentrada.','Todo corpo mergulhado recebe uma força para cima, o empuxo, igual ao peso do líquido que ele desloca: E = d_líquido · V · g.','Se a densidade da sonda for maior que a do líquido, ela afunda; se for menor, ela flutua.'],
 formula:'d = m ÷ V      E = d_líquido · V · g',
 dica:'A sonda precisa ter densidade entre 1 000 e 1 300 kg/m³. Multiplique essas densidades pelo volume da sonda para achar a faixa de massa.',
 perg:d=>[
  {p:`Sua sonda tinha ${fmt(d.m)} kg e ${fmt(d.V,2)} m³. Qual era a densidade dela?`,...alt(fmt(d.m/d.V)+' kg/m³',[fmt(d.m*d.V,2)+' kg/m³',fmt(d.V/d.m,4)+' kg/m³'],1)},
  {p:`Totalmente dentro da água (1 000 kg/m³), qual empuxo a sua sonda de ${fmt(d.V,2)} m³ recebia no Planeta Urucuia (g = 4 m/s²)?`,...alt(fmt(1000*d.V*4)+' N',[fmt(1000*d.V*10)+' N',fmt(1000*d.V)+' N'],0)},
  {p:'Por que o óleo fica por cima da água na lagoa?',...alt('Porque o óleo é menos denso que a água',['Porque o óleo é mais pesado','Porque a água empurra o óleo com o vento'],2)}]},
{id:'mergulho',setor:'planeta',titulo:'Mergulho no lago',conceito:'Teorema de Stevin',modo:'mergulho',mont:'traje',ctrl:['nadar'],
 briefing:['No fundo do lago salgado, de densidade 1 200 kg/m³, existem cristais raros. Você vai buscá-los mergulhando.','Quanto mais fundo, maior a pressão no seu traje. Se passar do limite do traje, ele cede.','Pegue os cristais a 5 m e a 14 m de profundidade e volte para a superfície. O terceiro, a 22 m, é uma armadilha para traje fraco.'],
 aula:['Num líquido parado, a pressão aumenta com a profundidade. Cada camada de líquido pesa sobre as de baixo.','A pressão total num ponto é a pressão do ar na superfície mais a pressão do líquido: p = p₀ + d · g · h.','Num planeta com gravidade menor, a pressão cresce mais devagar com a profundidade.'],
 formula:'p = p₀ + d · g · h',

 sonda:{esq:E=>{E.so??=1;return opcoes('so','Tamanho da sonda',SONDAS,x=>`volume ${fmt(x.V,2)} m³`)},

function desSonda(i){const s=[16,20,26][i];setSvg(150,`${CAMADAS.map((q,k)=>`<rect x="30" y="${30+k*36}" width="140" height="36" fill="${q.cor}"/><text x="165" y="${52+k*36}" text-anchor="end" font-size="10" ${fonte} fill="#fff">${q.n} ${q.d}</text>`).join('')}<rect x="30" y="20" width="140" height="10" fill="none"/><line x1="100" y1="0" x2="100" y2="16" stroke="#5a6470" stroke-width="2"/><rect x="${100-s/2}" y="16" width="${s}" height="${s}" rx="3" fill="#ff8a5c" stroke="#c63d0b"/>`)}
function desTraje(i){const c=['#e3e8ee','#f2c21b','#ff5a1f'][i];setSvg(150,`<rect x="0" y="60" width="200" height="90" fill="#2f7f8f"/><circle cx="100" cy="50" r="20" fill="#fff" stroke="${c}" stroke-width="5"/><rect x="88" y="42" width="24" height="12" rx="5" fill="#c99700"/><rect x="84" y="70" width="32" height="40" rx="8" fill="#fff" stroke="${c}" stroke-width="5"/><rect x="88" y="110" width="9" height="26" fill="#fff"/><rect x="103" y="110" width="9" height="26" fill="#fff"/><text x="100" y="146" text-anchor="middle" font-size="10" ${fonte} fill="#fff">${fmt(TRAJES[i].p)} Pa</text>`)}
function desBarometro(){setSvg(150,`<rect x="40" y="120" width="120" height="22" rx="4" fill="#9aa5b1"/><rect x="40" y="128" width="120" height="14" fill="#b8c0c8"/><rect x="92" y="10" width="16" height="125" rx="3" fill="#eef1f4" stroke="#5a6470"/><rect x="94" y="72" width="12" height="60" fill="#9aa5b1"/><line x1="120" y1="72" x2="120" y2="128" stroke="#ff5a1f" stroke-width="2"/><text x="126" y="104" font-size="11" ${fonte} fill="#c63d0b">0,37 m</text><text x="60" y="40" font-size="10" ${fonte} fill="#5a6470">vácuo</text>`)}
function desPistao(i){const w=[30,48,68][i];setSvg(150,`<rect x="20" y="70" width="14" height="60" fill="#3f8fc4"/><rect x="${200-30-w}" y="70" width="${w}" height="60" fill="#3f8fc4"/><rect x="20" y="126" width="${170-w}" height="14" fill="#3f8fc4"/><rect x="18" y="60" width="18" height="10" fill="#5a6470"/><rect x="${200-32-w}" y="60" width="${w+4}" height="10" fill="#5a6470"/><rect x="${200-30-w}" y="30" width="${w}" height="30" rx="5" fill="#f2c21b"/><text x="${200-30-w/2}" y="50" text-anchor="middle" font-size="10" ${fonte} fill="#3a2d00">rover</text><path d="M27 20v34" stroke="#ff5a1f" stroke-width="3"/><path d="M21 48l6 10 6-10z" fill="#ff5a1f"/><text x="38" y="30" font-size="10" ${fonte} fill="#c63d0b">F₁</text>`)}

/* ---------- Estado e balões ---------- */
let prog={};try{prog=JSON.parse(localStorage.getItem('baseLanc3')||'{}')}catch(e){}
const salvar=()=>{try{localStorage.setItem('baseLanc3',JSON.stringify(prog))}catch(e){}contar()};
const contar=()=>{$('#cont').textContent='★ '+Object.values(prog).reduce((a,b)=>a+b,0)+' / '+MISSOES.length*3};

function base(){parar();
 tela.innerHTML='<h2>Escolha um setor da base</h2><p class="sub">Cada missão é uma aula de Física do 1º ano. Monte, pilote e ganhe até 3 estrelas.</p><div class="grid">'+
 SETORES.map(s=>{const ms=MISSOES.filter(m=>m.setor===s.id),e=ms.reduce((a,m)=>a+(prog[m.id]||0),0);return `<button class="setor on" data-s="${s.id}"><svg viewBox="0 0 64 64" aria-hidden="true">${s.ico}</svg><h3>${s.nome}</h3><small>${s.temas}</small><span class="tag">${ms.length} missões · ★ ${e}/${ms.length*3}</span></button>`}).join('')+'</div>';
 tela.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>setor(b.dataset.s));
 dizer(Object.keys(prog).length?'Bom te ver de volta, piloto! Escolha um setor para continuar.':'Olá, piloto! Eu sou o Prof. ExperimentaJoão, chefe desta base. Aqui você monta foguetes, pilota e aprende Física. Escolha um setor para começar.',[]);
}
function setor(id){parar();const s=SETORES.find(x=>x.id===id),ms=MISSOES.filter(m=>m.setor===id);
 tela.innerHTML=`<button class="voltar" id="vb">◀ Voltar à base</button><h2>${s.nome}</h2><p class="sub">${s.temas}</p>`+
 ms.map((m,i)=>`<button class="missao" data-m="${m.id}"><span class="n">${i+1}</span><span><h3>${m.titulo}</h3><small class="sub">${m.conceito}</small></span><span class="st" aria-label="${prog[m.id]||0} estrelas">${estrelas(prog[m.id]||0)}</span></button>`).join('');
 $('#vb').onclick=base;tela.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>missao(MISSOES.find(m=>m.id===b.dataset.m)));
 const p=ms.find(m=>!prog[m.id]);
 dizer(p?`Sugestão: comece por "${p.titulo}". Cada missão tem briefing, aula, montagem, missão e relatório.`:'Setor completo! Tente 3 estrelas em todas.',p?[['Começar '+p.titulo,()=>missao(p),1]]:[]);
}

const FASES=['Briefing','Aula','Montagem','Missão','Relatório'];
let M=null,montar=null;const esc={};
function missao(m){parar();M=m;
 montar=(f,html)=>{parar();tela.innerHTML=`<button class="voltar" id="vb">◀ Voltar ao setor</button><h2>${m.titulo}</h2><div class="fase">${FASES.map((x,i)=>`<span class="${i===f?'at':''}">${x}</span>`).join('')}</div>`+html;$('#vb').onclick=()=>setor(m.setor)};
 montar(0,'<div class="voo"><canvas id="cv"></canvas></div>');jogo=jogar(m,true);
 falar(m.briefing,()=>{montar(1,'<div class="voo"><canvas id="cv"></canvas></div>');jogo=jogar(m,true);falar(m.aula,montagem,'Ir para a montagem',`<div class="formula">${m.formula}</div>`)},'Entendi a missão');
}

/* ---------- Montagem ---------- */
function opcoes(k,titulo,L,desc){return `<div class="peca">${titulo}</div><div class="ops">${L.map((x,i)=>`<button type="button" class="op" data-k="${k}" data-i="${i}"><b>${x.n}</b><span>${desc(x)}</span>${x.c?`<span class="c">custo ${x.c}</span>`:''}</button>`).join('')}</div>`}
const lin=(r,v,big)=>`<div class="lin${big?' big':''}"><span>${r}</span><b>${v}</b></div>`;
function montagem(){const m=M,E=esc[m.id]||(esc[m.id]={});
 let esq='',orc=m.orc||0;
 const T={
  nave:()=>{E.mo??=1;E.ta??=1;return opcoes('mo','Motor',MOT_ESP,x=>`${fmt(x.F)} N · ${x.m} kg`)+opcoes('ta','Tanque',TAN_ESP,x=>`${x.t} s de queima · ${x.m} kg`)},
  naveT:()=>{E.mo??=0;E.ta??=0;orc=4;return opcoes('mo','Motor',MOT_TOR,x=>`${fmt(x.F)} N · ${x.m} kg`)+opcoes('ta','Tanque',TAN_TOR,x=>`${x.t} s de queima · ${x.m} kg`)},
  motorP:()=>{E.mo??=0;orc=3;return opcoes('mo','Motor do módulo lunar',MOT_POU,x=>`até ${fmt(x.F)} N`)},
  mola:()=>{E.ml??=0;return opcoes('ml','Mola de separação',MOLAS,x=>`${fmt(x.I)} N·s`)},
  cabo:()=>{E.cb??=0;orc=2;return opcoes('cb','Cabo de reboque',CABOS,x=>`aguenta ${fmt(x.T)} N`)},
  bloco:()=>{E.bl??=1;orc=3;return opcoes('bl','Contrapeso',BLOCOS,x=>`${fmt(x.m)} kg`)},
  mundo:()=>{E.mu??=1;return opcoes('mu','Mundo',MUNDOS,x=>`g = ${fmt(x.g,2)} m/s²`)+`<div class="peca">Potência programada para pairar (%)</div><input type="text" id="pp" inputmode="decimal" autocomplete="off" value="${E.pp??''}"><div class="err" id="ppe"></div>`},
  carga:()=>{E.pos??={A:null,B:null,C:null};E.sel??='A';return `<div class="peca">1. Toque num contêiner</div><div class="ops">${CARGAS.map(x=>`<button type="button" class="op" data-cg="${x.n}"><b>Contêiner ${x.n}</b><span>${x.m} kg</span><span class="c" id="pc${x.n}"></span></button>`).join('')}</div><div class="peca">2. Toque numa posição da viga (metros a partir do centro)</div><div class="slots">${SLOTS.map(x=>`<button type="button" class="slot" data-sl="${x}">${x>0?'+':''}${x}</button>`).join('')}</div>`},
  orb:()=>''}[m.mont];
 const X=MONT_EXTRA[m.mont];if(X&&X.orc)orc=X.orc;
 esq=T?T():X.esq(E);
 montar(2,`<div class="hang"><div>${esq||'<p class="sub">Nesta missão a nave já vem pronta. Confira os dados ao lado.</p>'}</div><div class="ficha" aria-live="polite"><svg viewBox="0 0 200 150" id="desenho" aria-hidden="true"></svg><div id="fic"></div><button class="pri" id="lanca" style="width:100%;margin-top:10px">Começar missão</button></div></div>`);
 if(X&&X.bind)X.bind(E);
 const at=()=>{tela.querySelectorAll('.op[data-k]').forEach(b=>b.classList.toggle('sel',E[b.dataset.k]==b.dataset.i));
  let html='',custo=0,info='',ok=true;
  if(m.mont==='nave'){const mo=MOT_ESP[E.mo],ta=TAN_ESP[E.ta];custo=mo.c+ta.c;const mt=CAPS+mo.m+ta.m,I=mo.F*ta.t,dv=I/mt;
   html=lin('Massa total m',fmt(mt)+' kg')+lin('Força do motor F',fmt(mo.F)+' N')+lin('Aceleração a = F ÷ m',fmt(mo.F/mt,2)+' m/s²')+lin('Impulso máximo I = F · Δt',fmt(I)+' N·s')+lin('Δv máximo = I ÷ m',fmt(dv,1)+' m/s',1);
   info=dv<m.pede?`Essa nave só consegue ${fmt(dv,1)} m/s. A missão pede pelo menos ${m.pede} m/s.`:`Dá para a missão: ${fmt(dv,1)} m/s de Δv. Sobra combustível se você pilotar bem.`;desFoguete(E.mo,E.ta)}
  if(m.mont==='naveT'){const mo=MOT_TOR[E.mo],ta=TAN_TOR[E.ta];custo=mo.c+ta.c;const mt=CAPS+mo.m+ta.m,P=mt*G,R=mo.F-P;
   html=lin('Massa total m',fmt(mt)+' kg')+lin('Peso P = m · g',fmt(P)+' N')+lin('Força do motor F',fmt(mo.F)+' N')+lin('Resultante R = F − P',fmt(R)+' N')+lin('Aceleração a = R ÷ m',fmt(Math.max(0,R)/mt,2)+' m/s²',1)+lin('Tempo de queima',ta.t+' s');
   info=R<=0?`O motor (${fmt(mo.F)} N) não vence o peso (${fmt(P)} N). O foguete nem sai do chão!`:`Vai decolar com ${fmt(R/mt,2)} m/s² de aceleração. Será que o combustível dura até 300 m?`;desFoguete(Math.min(2,E.mo),E.ta)}
  if(m.mont==='motorP'){const mo=MOT_POU[E.mo];custo=mo.c;const P=1000*1.6;
   html=lin('Massa do módulo','1.000 kg')+lin('Gravidade da Lua','1,6 m/s²')+lin('Peso P = m · g',fmt(P)+' N')+lin('Força máxima do motor',fmt(mo.F)+' N',1)+lin('Potência para descer constante','calcule: P ÷ F',1);
   info=mo.F<P?'Com esse motor a força nunca alcança o peso. O módulo só acelera para baixo!':'Esse motor vence o peso. Calcule a potência em que F fica igual a P: é nela que o módulo desce com velocidade constante.';desModulo()}

  PEDRAS.forEach(p=>{const x=sx(p.x);c.fillStyle=grad(0,gy-p.h*K,0,gy,[[0,'#9c7a58'],[1,'#5e4630']]);c.beginPath();c.moveTo(x-p.w/2*K,gy);c.lineTo(x-p.w*.35*K,gy-p.h*K);c.lineTo(x+p.w*.3*K,gy-p.h*K*.95);c.lineTo(x+p.w/2*K,gy);c.fill()});
  const bx=sx(50);c.fillStyle=grad(0,gy-K*5,0,gy,[[0,'#eef1f4'],[1,'#9aa5b1']]);rr(bx,gy-K*4,K*9,K*4,K*.6);c.fill();c.fillStyle='#cfd6de';c.beginPath();c.arc(bx+K*9,gy,K*4,Math.PI,0);c.fill();
  c.fillStyle='rgba(30,40,55,.85)';rr(bx+K*.4,gy-K*3.4,K*3.4,K*3.3,K*.3);c.fill();const f=(E.pc-P0)/(100000-P0);c.fillStyle=`rgba(95,176,255,${.15+.4*f})`;rr(bx+K*.4,gy-K*3.4,K*3.4,K*3.3,K*.3);c.fill();
  c.fillStyle=E.est==='fora'?'#2f9e5b':'#e5484d';c.fillRect(bx,gy-K*3.2,K*.35,K*3.2);c.fillStyle='#e5484d';c.fillRect(bx+K*3.8,gy-K*3.2,K*.35,K*3.2);T('eclusa',bx+K*2.1,gy-K*4.3,'#fff','center',13);T('base · 100.000 Pa',bx+K*7.5,gy-K*1.6,'#2b3440','center',13);
  S.parts.forEach(p=>{c.globalAlpha=Math.min(1,p.v);c.fillStyle=p.c;c.beginPath();c.arc(sx(p.x),gy-p.y*K,3,0,7);c.fill()});c.globalAlpha=1;
  astronauta(sx(E.x),gy-E.y*K,K*.75,E.dir,S.t,E.est==='fora'&&Math.abs(E.vx)>.2&&E.noChao);
  if(!S.demo){const r=Math.min(40,H*.09);relogio(W-r-16,r+20,r,1-(E.ps-35000)/25000,'traje',fmt(E.ps)+' Pa');
   painel([`pressão do traje = ${fmt(E.ps)} Pa`,`pressão lá fora = 20.000 Pa`,`câmara da eclusa = ${fmt(E.pc)} Pa`,`força na porta = Δp · A = ${fmt((100000-E.pc)*2)} N`],W);T('g = 4 m/s²',W-12,H-14,'#fff','right',13)}}
};
MODOS.pascal={
 init(S){const A=PISTOES[S.E.ps??1].A;S.Pc={A2:A,F1:2400*.01/A,sobe:0,n:0,ciclo:0,o2:40,fraco:0}},
 inicio(S){return 'Segure BOMBEAR para empurrar a alavanca. Cada bombada desce o pistão pequeno 1 m.'},
 passo(S,dt){const P=S.Pc;P.o2-=dt;if(S.ctl.i){P.ciclo+=dt;if(P.F1>100)P.fraco+=dt;else if(P.ciclo>=.4){P.ciclo=0;P.n++;P.sobe+=.01/P.A2}}else P.ciclo=0;
  const bB=$('#bB');if(bB)bB.classList.toggle('on',!!S.ctl.i)},
 bonusTxt(){return 'Para a segunda estrela, tire o rover em até 15 segundos.'},
 regras(S){const P=S.Pc,fim=(ok,msg,b)=>{S.boom=null;S.acabar(ok,msg,b,{A2:P.A2})};
  if(P.sobe>=.5)return fim(true,`Rover resgatado em ${P.n} bombadas! Você fazia ${fmt(P.F1)} N e o pistão grande fazia 2.400 N: a pressão de ${fmt(P.F1/.01)} Pa foi a mesma nos dois.`,S.t<=15),'';
  if(P.fraco>2)return fim(false,`Você não conseguiu mover a alavanca! Com esse pistão a força necessária é ${fmt(P.F1)} N, maior que os 100 N que você consegue fazer.`),'';
  if(P.o2<=0)return fim(false,`O oxigênio acabou com o rover a ${fmt(P.sobe*100)} cm. Com esse pistão cada bombada sobe pouco.`),'';

 desenha(S,W,H){const P=S.Pc,K=Math.min(W/12,H/6),gy=H*.42,fb=gy+K*.5;

  c.fillStyle='#3f8fc4';const sx0=W*.2;c.fillRect(sx0-K*.18,gy+K*.4,K*.36,H*.85-gy-K*.4);c.fillRect(sx0-K*.18,H*.85-K*.4,bx-sx0,K*.4);c.fillRect(bx-bw/2,gy+K*1.4-P.sobe*K*0,bw,H*.85-gy-K*1.4);
  const ty=gy+K*1.4-P.sobe*K*2.6;c.fillStyle='#5a6470';c.fillRect(bx-bw/2,ty-K*.15,bw,K*.15);
  roverD(bx,ty-K*.15,K*.45,0,2,P.n*.4);
  const fase=S.ctl.i&&P.F1<=100?Math.sin(P.ciclo/.4*Math.PI):0,ly=gy-K*.6+fase*K*.4;c.strokeStyle='#cfd6de';c.lineWidth=5;c.beginPath();c.moveTo(sx0-K*1.4,gy-K*1.2);c.lineTo(sx0+K*.2,ly);c.stroke();c.fillStyle='#5a6470';c.fillRect(sx0-K*.2,ly,K*.4,gy+K*.4-ly);
  astronauta(sx0-K*1.9,gy,K*.55,1,S.t,false);
  if(!S.demo){seta(sx0+K*.6,gy-K*1.8,0,K*.9,'#ffb02e','F₁');seta(bx+bw/2+K*.4,ty+K*.6,0,-K*.9,'#5fb0ff','F₂');
   const yb=painel([`F₁ = 2 400 × 0,01 ÷ ${fmt(P.A2,1)} = ${fmt(P.F1)} N`,`pressão = F₁ ÷ A₁ = ${fmt(P.F1/.01)} Pa`,`bombadas: ${P.n}`,`rover subiu: ${fmt(P.sobe*100)} de 50 cm`],W,16);barra(yb-18,P.o2/40,'O₂ '+fmt(Math.max(0,P.o2),0)+' s')}}
};
