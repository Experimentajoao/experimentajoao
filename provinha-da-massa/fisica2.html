  <div class="lin"><a class="voltar" href="index.html">◀ Início</a><h1>Física 2º ano · Óptica, Ondas e Som</h1></div>

<script>
/* Link do desafio Kahoot no modo Atribuir (cole entre as aspas) */
var KAHOOT_DESAFIO = '';

var VSOM = 340, audio = null;
function tocar(freq, ondaReal, ondaImag, dur, vol) {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    var o = audio.createOscillator(), g = audio.createGain();
    if (ondaReal) o.setPeriodicWave(audio.createPeriodicWave(new Float32Array(ondaReal), new Float32Array(ondaImag)));
    o.frequency.value = freq; g.gain.value = 0;
    g.gain.linearRampToValueAtTime(vol || 0.2, audio.currentTime + 0.03);
    g.gain.linearRampToValueAtTime(0, audio.currentTime + (dur || 1));
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + (dur || 1) + 0.05);
  } catch (e) {}
}
function modos(c, lista, inicial, on) {
  var caixas = {};
  P.seg(c, 'O que estudar', lista, inicial, function (v) { for (var k in caixas) caixas[k].style.display = k === v ? '' : 'none'; on(v); });
  lista.forEach(function (m) { caixas[m[0]] = P.el('div'); caixas[m[0]].style.display = m[0] === inicial ? '' : 'none'; c.appendChild(caixas[m[0]]); });
  return caixas;
}

/* ============ 1. OLHO E LENTES ============ */
function simLentes(a) {
  var T = P.tela(a.tela, 640, 320), ctx = T.ctx, c = a.ctrl, modo = 'lente';
  var cx = modos(c, [['lente', 'Lentes (lupa, câmera)'], ['olho', 'Olho humano e óculos']], 'lente', function (v) { modo = v; calc(); });
  P.formula(cx.lente, '<b>1/f = 1/p + 1/p\'</b> &nbsp; e &nbsp; <b>A = −p\' / p</b>');
  var tipo = P.seg(cx.lente, 'Tipo de lente', [['conv', 'Convergente'], ['div', 'Divergente']], 'conv', calc);
  var fo = P.slider(cx.lente, 'Distância focal (f)', { min: 4, max: 12, step: 1, value: 8, unit: 'cm' }, calc);
  var po = P.slider(cx.lente, 'Distância do objeto à lente (p)', { min: 2, max: 28, step: 1, value: 20, unit: 'cm' }, calc);
  P.dica(cx.lente, 'Para a lente divergente, use f negativo na fórmula. p\' negativo indica imagem virtual (do mesmo lado do objeto).');
  var def = P.seg(cx.olho, 'Olho', [['normal', 'Normal'], ['mio', 'Miopia'], ['hip', 'Hipermetropia']], 'normal', calc);
  var cor = P.seg(cx.olho, 'Óculos', [['sem', 'Sem óculos'], ['div', 'Lente divergente'], ['conv', 'Lente convergente']], 'sem', calc);
  var L = P.leituras(c, [['a', ''], ['b', ''], ['c', ''], ['d', ''], ['e', '']]), rot = c.querySelectorAll('.leit small');
  var est = {};
  function calc() {
    if (modo === 'lente') {
      var f = tipo.get() === 'conv' ? fo.get() : -fo.get(), p = po.get();
      var pl = Math.abs(p - f) < 1e-9 ? Infinity : 1 / (1 / f - 1 / p), A = -pl / p;
      est = { f: f, p: p, pl: pl, A: A };
      ['p (objeto)', 'f', 'p\' (imagem)', 'Aumento A', 'Imagem'].forEach(function (t, i) { rot[i].textContent = t; });
      L.set('a', P.fmt(p) + ' cm'); L.set('b', P.fmt(f) + ' cm');
      L.set('c', isFinite(pl) ? P.fmt(pl, 1) + ' cm' : 'no infinito'); L.set('d', isFinite(pl) ? P.fmt(A, 2) : '—');
      L.set('e', !isFinite(pl) ? 'Imprópria (não se forma)' : (pl > 0 ? 'Real' : 'Virtual') + ', ' + (A > 0 ? 'direita' : 'invertida') + ', ' + (Math.abs(A) > 1.001 ? 'maior' : Math.abs(A) < 0.999 ? 'menor' : 'igual'));
    } else {
      var base = { normal: 420, mio: 385, hip: 455 }[def.get()], sh = { sem: 0, div: 35, conv: -35 }[cor.get()];
      est = { xf: base + sh };
      var onde = est.xf < 412 ? 'Antes da retina' : est.xf > 428 ? 'Depois da retina' : 'Na retina';
      ['Defeito', 'Óculos', 'Onde a imagem se forma', 'Visão de longe', ''].forEach(function (t, i) { rot[i].textContent = t; });
      L.set('a', { normal: 'Nenhum', mio: 'Miopia (olho alongado)', hip: 'Hipermetropia (olho curto)' }[def.get()]);
      L.set('b', { sem: 'Sem', div: 'Divergente', conv: 'Convergente' }[cor.get()]);
      L.set('c', onde); L.set('d', onde === 'Na retina' ? 'Nítida' : 'Embaçada'); L.set('e', '');
    }
  }
  calc();
  function raio(x1, y1, x2, y2, cor, trac) { ctx.strokeStyle = cor; ctx.lineWidth = 2; ctx.setLineDash(trac ? [6, 5] : []); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]); }
  return function () {
    ctx.clearRect(0, 0, 640, 320);
    if (modo === 'lente') {
      var s = 11, x0 = 330, y0 = 160, h = 40;
      ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(640, y0); ctx.stroke();
      ctx.strokeStyle = '#1f5fbf'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, 30); ctx.lineTo(x0, 290); ctx.stroke();
      var conv = est.f > 0;
      P.seta(ctx, x0, 60, x0, 28, '#1f5fbf', 3); P.seta(ctx, x0, 260, x0, 292, '#1f5fbf', 3);
      if (!conv) { P.seta(ctx, x0, 40, x0, 60, '#1f5fbf', 3); P.seta(ctx, x0, 280, x0, 260, '#1f5fbf', 3); }
      [-1, 1].forEach(function (sg) { ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(x0 + sg * Math.abs(est.f) * s, y0, 4, 0, 7); ctx.fill(); P.texto(ctx, sg < 0 ? 'F' : 'F\'', x0 + sg * Math.abs(est.f) * s, y0 + 16, { tam: 12, cor: '#c0392b' }); });
      var xo = x0 - est.p * s;
      P.seta(ctx, xo, y0, xo, y0 - h, '#1d8a52', 4); P.texto(ctx, 'objeto', xo, y0 + 16, { tam: 12, cor: '#1d8a52' });
      if (isFinite(est.pl)) {
        var xi = x0 + est.pl * s, yi = y0 - est.A * h, real = est.pl > 0;
        /* raio paralelo */
        raio(xo, y0 - h, x0, y0 - h, '#e07a1f');
        var dx = xi - x0, dy = yi - (y0 - h), k = 900 / Math.hypot(dx, dy);
        if (real) raio(x0, y0 - h, x0 + dx * k, y0 - h + dy * k, '#e07a1f');
        else { raio(x0, y0 - h, x0 - dx * k, y0 - h - dy * k, '#e07a1f'); raio(x0, y0 - h, xi, yi, '#e07a1f', true); }
        /* raio pelo centro */
        var ex = x0 - xo, ey = y0 - (y0 - h), k2 = 900 / Math.hypot(ex, ey);
        raio(xo, y0 - h, xo + ex * k2, y0 - h + ey * k2, '#8e44ad');
        if (!real) raio(xo, y0 - h, xi, yi, '#8e44ad', true);
        if (xi > -50 && xi < 690) { ctx.globalAlpha = real ? 1 : 0.6; P.seta(ctx, xi, y0, xi, yi, '#163f80', 4); ctx.globalAlpha = 1; P.texto(ctx, real ? 'imagem real' : 'imagem virtual', xi, y0 + (est.A > 0 ? 16 : -16), { tam: 12, cor: '#163f80' }); }
        else P.texto(ctx, 'imagem fora da tela (p\' = ' + P.fmt(est.pl, 1) + ' cm)', 470, 300, { tam: 12, cor: '#163f80' });
      } else P.texto(ctx, 'Objeto no foco: os raios saem paralelos, a imagem não se forma', 320, 300, { tam: 13, cor: '#c0392b' });
    } else {
      var y0 = 160;
      ctx.fillStyle = '#fdf1e6'; ctx.strokeStyle = '#a0522d'; ctx.lineWidth = 3;
      var fundo = 420;
      ctx.beginPath(); ctx.ellipse((300 + fundo) / 2, y0, (fundo - 290) / 2 + 15, 95, 0, 0, 7); ctx.fill(); ctx.stroke();
      var retx = 420; ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(retx - 60, y0, 60, -0.6, 0.6); ctx.stroke();
      P.texto(ctx, 'retina', retx + 10, y0 - 45, { tam: 12, cor: '#c0392b' });
      ctx.fillStyle = 'rgba(31,95,191,.35)'; ctx.beginPath(); ctx.ellipse(300, y0, 10, 45, 0, 0, 7); ctx.fill();
      P.texto(ctx, 'cristalino', 300, y0 + 62, { tam: 12 });
      if (cor.get() !== 'sem') {
        ctx.strokeStyle = '#1f5fbf'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(200, 90); ctx.lineTo(200, 230); ctx.stroke();
        var cv = cor.get() === 'conv'; P.seta(ctx, 200, 105, 200, cv ? 86 : 100, '#1f5fbf', 3); P.seta(ctx, 200, 215, 200, cv ? 234 : 220, '#1f5fbf', 3);
        P.texto(ctx, cv ? 'convergente' : 'divergente', 200, 250, { tam: 12, cor: '#1f5fbf' });
      }
      [-30, -15, 15, 30].forEach(function (hh) {
        var yin = y0 + hh, x1 = 300, yl = yin;
        if (cor.get() !== 'sem') { raio(10, yin, 200, yin, '#e0a01f'); yl = yin + (cor.get() === 'div' ? hh * 0.15 : -hh * 0.15); raio(200, yin, x1, yl, '#e0a01f'); }
        else raio(10, yin, x1, yin, '#e0a01f');
        var xf = est.xf, k = (480 - x1) / (xf - x1);
        raio(x1, yl, 480, yl + (y0 - yl) * k, '#e0a01f');
      });
      ctx.fillStyle = '#163f80'; ctx.beginPath(); ctx.arc(est.xf, y0, 5, 0, 7); ctx.fill();
      P.texto(ctx, 'foco', est.xf, y0 + 18, { tam: 12, cor: '#163f80' });
      P.texto(ctx, 'luz de um objeto distante', 90, y0 - 55, { tam: 12 });
    }
  };
}

/* ============ 2. MHS E ONDAS ============ */
function simMHS(a) {
  var T = P.tela(a.tela, 640, 320), ctx = T.ctx, c = a.ctrl, modo = 'mola', t = 0, hist = [];
  var cx = modos(c, [['mola', 'Massa-mola'], ['pend', 'Pêndulo'], ['onda', 'Onda na corda']], 'mola', function (v) { modo = v; t = 0; hist = []; calc(); });
  P.formula(cx.mola, '<b>T = 2π √(m / k)</b> &nbsp; f = 1 / T');
  var k = P.slider(cx.mola, 'Constante da mola (k)', { min: 10, max: 100, step: 5, value: 40, unit: 'N/m' }, calc);
  var m = P.slider(cx.mola, 'Massa (m)', { min: 0.1, max: 2, step: 0.1, value: 1, unit: 'kg' }, calc);
  var A = P.slider(cx.mola, 'Amplitude (A)', { min: 2, max: 20, step: 1, value: 15, unit: 'cm' }, calc);
  P.formula(cx.pend, '<b>T = 2π √(L / g)</b> &nbsp; g = 10 m/s²');
  var Lp = P.slider(cx.pend, 'Comprimento do fio (L)', { min: 0.1, max: 2.5, step: 0.05, value: 1, unit: 'm' }, calc);
  var bcr = P.el('button', 'bt', '⏱ Contar oscilações em 10 s'); cx.pend.appendChild(bcr);
  P.formula(cx.onda, '<b>v = λ · f</b> &nbsp; T = 1 / f');
  var fo = P.slider(cx.onda, 'Frequência da mão (f)', { min: 0.5, max: 4, step: 0.5, value: 2, unit: 'Hz' }, calc);
  var vo = P.slider(cx.onda, 'Velocidade da onda na corda (v)', { min: 1, max: 6, step: 0.5, value: 2, unit: 'm/s' }, calc);
  var tp = P.seg(cx.onda, 'Tipo de onda', [['trans', 'Transversal (corda)'], ['long', 'Longitudinal (mola/som)']], 'trans');
  P.dica(cx.onda, 'A régua embaixo vai de 0 a 6 m. Siga o ponto vermelho: ele só sobe e desce, não viaja com a onda.');
  var L = P.leituras(c, [['a', ''], ['b', ''], ['c', ''], ['d', '']]), rot = c.querySelectorAll('.leit small');
  var cron = { on: false, t: 0, n: 0, fase: 0 };
  bcr.onclick = function () { t = 0; cron = { on: true, t: 0, n: 0, ult: 1 }; };
  function calc() {
    if (modo === 'mola') {
      var w = Math.sqrt(k.get() / m.get()), Tt = 2 * Math.PI / w;
      ['Período T', 'Frequência f', 'Velocidade máxima (no centro)', 'Oscilações em 10 s'].forEach(function (s, i) { rot[i].textContent = s; });
      L.set('a', P.fmt(Tt, 2) + ' s'); L.set('b', P.fmt(1 / Tt, 2) + ' Hz'); L.set('c', P.fmt(A.get() / 100 * w, 2) + ' m/s'); L.set('d', P.fmt(10 / Tt, 1));
    } else if (modo === 'pend') {
      var Tp = 2 * Math.PI * Math.sqrt(Lp.get() / 10);
      ['Período T', 'Frequência f', 'Cronômetro', 'Oscilações contadas'].forEach(function (s, i) { rot[i].textContent = s; });
      L.set('a', P.fmt(Tp, 2) + ' s'); L.set('b', P.fmt(1 / Tp, 2) + ' Hz');
    } else {
      ['Comprimento de onda λ', 'Período T', 'Velocidade v', 'Frequência f'].forEach(function (s, i) { rot[i].textContent = s; });
      L.set('a', P.fmt(vo.get() / fo.get(), 2) + ' m'); L.set('b', P.fmt(1 / fo.get(), 2) + ' s'); L.set('c', P.fmt(vo.get()) + ' m/s'); L.set('d', P.fmt(fo.get()) + ' Hz');
    }
  }
  calc();
  return function (dt) {
    t += dt; ctx.clearRect(0, 0, 640, 320);
    if (modo === 'mola') {
      var w = Math.sqrt(k.get() / m.get()), x = A.get() / 100 * Math.cos(w * t), px = 200 + x * 600;
      ctx.fillStyle = '#555'; ctx.fillRect(20, 60, 10, 80);
      ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(30, 100);
      for (var i = 1; i <= 16; i++) ctx.lineTo(30 + (px - 30 - 25) * i / 16, 100 + (i % 2 ? -12 : 12) * (i < 16 ? 1 : 0));
      ctx.lineTo(px - 25, 100); ctx.stroke();
      ctx.fillStyle = '#1f5fbf'; ctx.fillRect(px - 25, 75, 50, 50); P.texto(ctx, P.fmt(m.get()) + ' kg', px, 100, { cor: '#fff', tam: 12 });
      ctx.strokeStyle = '#c0392b'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(200, 50); ctx.lineTo(200, 150); ctx.stroke(); ctx.setLineDash([]);
      P.texto(ctx, 'equilíbrio', 200, 40, { tam: 11, cor: '#c0392b' });
      var vel = -A.get() / 100 * w * Math.sin(w * t); P.seta(ctx, px, 150, px + vel * 60, 150, '#1d8a52', 3);
      hist.push(x); if (hist.length > 600) hist.shift();
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(20, 250); ctx.lineTo(620, 250); ctx.stroke();
      ctx.strokeStyle = '#1f5fbf'; ctx.lineWidth = 2; ctx.beginPath();
      hist.forEach(function (v, i) { var X = 20 + i, Y = 250 - v * 300; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke();
      P.texto(ctx, 'posição × tempo', 560, 190, { tam: 12 });
    } else if (modo === 'pend') {
      var Tp = 2 * Math.PI * Math.sqrt(Lp.get() / 10), th = 0.35 * Math.cos(2 * Math.PI * t / Tp), len = 40 + Lp.get() * 100;
      var bx = 320 + len * Math.sin(th), by = 20 + len * Math.cos(th);
      ctx.fillStyle = '#555'; ctx.fillRect(220, 14, 200, 6);
      ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(320, 20); ctx.lineTo(bx, by); ctx.stroke();
      ctx.fillStyle = '#e07a1f'; ctx.beginPath(); ctx.arc(bx, by, 14, 0, 7); ctx.fill();
      if (cron.on) {
        cron.t += dt; var n = Math.floor(cron.t / Tp);
        cron.n = n; if (cron.t >= 10) { cron.on = false; cron.t = 10; cron.n = Math.floor(10 / Tp); }
      }
      L.set('c', P.fmt(cron.t, 1) + ' s'); L.set('d', String(cron.n));
      P.texto(ctx, 'L = ' + P.fmt(Lp.get()) + ' m', 420, 40, { tam: 13 });
    } else {
      var f = fo.get(), v = vo.get(), lam = v / f, esc = 100, w2 = 2 * Math.PI * f;
      ctx.fillStyle = '#e8d3b0'; ctx.fillRect(10, 60, 14, 160);
      for (var X = 0; X <= 600; X += tp.get() === 'trans' ? 2 : 10) {
        var xm = X / esc, fase = w2 * t - 2 * Math.PI * xm / lam, on = t - xm / v > 0;
        var yv = on ? Math.sin(fase) : 0;
        if (tp.get() === 'trans') { ctx.fillStyle = '#1f5fbf'; ctx.fillRect(24 + X, 140 - yv * 50, 2, 3); }
        else { ctx.fillStyle = '#1f5fbf'; ctx.fillRect(24 + X + yv * 6, 90, 2, 100); }
      }
      var X0 = 300, xm0 = X0 / esc, on0 = t - xm0 / v > 0, y0 = on0 ? Math.sin(w2 * t - 2 * Math.PI * xm0 / lam) : 0;
      ctx.fillStyle = '#c0392b'; ctx.beginPath();
      if (tp.get() === 'trans') ctx.arc(24 + X0, 140 - y0 * 50, 7, 0, 7); else ctx.arc(24 + X0 + y0 * 6, 80, 7, 0, 7);
      ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(24, 270); ctx.lineTo(624, 270); ctx.stroke();
      for (var mm = 0; mm <= 6; mm++) { ctx.beginPath(); ctx.moveTo(24 + mm * esc, 264); ctx.lineTo(24 + mm * esc, 276); ctx.stroke(); P.texto(ctx, mm + ' m', 24 + mm * esc, 290, { tam: 12 }); }
      for (var mm2 = 0; mm2 < 6; mm2 += 0.5) { ctx.beginPath(); ctx.moveTo(24 + mm2 * esc, 267); ctx.lineTo(24 + mm2 * esc, 273); ctx.stroke(); }
    }
  };
}

/* ============ 3. FENÔMENOS ONDULATÓRIOS ============ */
function simFenomenos(a) {
  var T = P.tela(a.tela, 640, 360), ctx = T.ctx, c = a.ctrl, modo = 'refr', t = 0;
  var GW = 160, GH = 90, img = ctx.createImageData(GW, GH), off = document.createElement('canvas'); off.width = GW; off.height = GH; var octx = off.getContext('2d');
  var cx = modos(c, [['refl', 'Reflexão'], ['refr', 'Refração'], ['difr', 'Difração'], ['inter', 'Interferência'], ['harm', 'Harmônicos na corda']], 'refr', function (v) { modo = v; calc(); });
  P.dica(cx.refl, 'Uma fonte faz ondas perto de uma parede. As ondas refletidas parecem vir de uma fonte "atrás" da parede, como num espelho.');
  var dpar = P.slider(cx.refl, 'Distância da fonte até a parede', { min: 1, max: 5, step: 0.5, value: 2.5, unit: 'λ' }, calc);
  P.formula(cx.refr, 'Na refração a <b>frequência não muda</b>; mudam v e λ: <b>v = λ · f</b>');
  var v2 = P.slider(cx.refr, 'Velocidade na região rasa (v₂), com v₁ = 10 cm/s', { min: 3, max: 10, step: 1, value: 5, unit: 'cm/s' }, calc);
  var ang = P.slider(cx.refr, 'Ângulo de incidência', { min: 0, max: 60, step: 5, value: 30, unit: '°' }, calc);
  var fr = P.slider(cx.refr, 'Frequência da fonte (f)', { min: 1, max: 4, step: 0.5, value: 2, unit: 'Hz' }, calc);
  var lamD = P.slider(cx.difr, 'Comprimento de onda (λ)', { min: 1, max: 4, step: 0.5, value: 2, unit: 'cm' }, calc);
  var fen = P.slider(cx.difr, 'Largura da fenda (a)', { min: 1, max: 12, step: 1, value: 3, unit: 'cm' }, calc);
  P.dica(cx.difr, 'A difração é mais forte quando a fenda tem tamanho parecido com o comprimento de onda.');
  var lamI = P.slider(cx.inter, 'Comprimento de onda (λ)', { min: 1, max: 4, step: 0.5, value: 2, unit: 'cm' }, calc);
  var sep = P.slider(cx.inter, 'Distância entre as fontes (d)', { min: 2, max: 12, step: 1, value: 6, unit: 'cm' }, calc);
  P.dica(cx.inter, 'Regiões claras/escuras fortes: interferência construtiva. Regiões cinza paradas: destrutiva (as ondas se anulam).');
  P.formula(cx.harm, '<b>λ<sub>n</sub> = 2L / n</b> &nbsp; e &nbsp; <b>f<sub>n</sub> = n · v / 2L</b>');
  var Lc = P.slider(cx.harm, 'Comprimento da corda (L)', { min: 0.3, max: 1, step: 0.05, value: 0.65, unit: 'm' }, calc);
  var vc = P.slider(cx.harm, 'Velocidade da onda na corda (v)', { min: 100, max: 400, step: 10, value: 260, unit: 'm/s' }, calc);
  var nh = P.slider(cx.harm, 'Harmônico (n)', { min: 1, max: 6, step: 1, value: 1 }, calc);
  var bs = P.el('button', 'bt', '🔊 Ouvir'); cx.harm.appendChild(bs);
  bs.onclick = function () { tocar(nh.get() * vc.get() / (2 * Lc.get()), null, null, 1.2, 0.15); };
  var L = P.leituras(c, [['a', ''], ['b', ''], ['c', ''], ['d', '']]), rot = c.querySelectorAll('.leit small');
  function calc() {
    var r = ['', '', '', ''];
    if (modo === 'refr') {
      var f = fr.get(), th2 = Math.asin(v2.get() / 10 * Math.sin(ang.get() * Math.PI / 180)) * 180 / Math.PI;
      r = [['λ na região funda', P.fmt(10 / f, 2) + ' cm'], ['λ na região rasa', P.fmt(v2.get() / f, 2) + ' cm'], ['Frequência (nas duas)', P.fmt(f) + ' Hz'], ['Ângulo de refração', P.fmt(th2, 0) + '°']];
    } else if (modo === 'difr') r = [['λ', P.fmt(lamD.get()) + ' cm'], ['Fenda a', P.fmt(fen.get()) + ' cm'], ['a / λ', P.fmt(fen.get() / lamD.get(), 2)], ['Difração', fen.get() / lamD.get() <= 2 ? 'Forte (espalha muito)' : fen.get() / lamD.get() <= 4 ? 'Média' : 'Fraca']];
