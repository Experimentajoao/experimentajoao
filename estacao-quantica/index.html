:root{color-scheme:dark;--bg:#060d16;--card:#0c1826;--card2:#10223a;--ink:#e8f3ff;--mut:#8fa8c4;--line:#1d3550;--cy:#3fe0ff;--cy2:#9ff0ff;--ama:#f2c21b;--ok:#4fd18b;--okbg:#0f2c20;--bad:#ffb38a;--badbg:#33210f}

h1{font-size:clamp(22px,4vw,30px)}h2{font-size:clamp(21px,3.6vw,28px)}h3{font-size:18px}
header{display:flex;align-items:center;gap:12px;padding:12px max(4vw,14px);background:rgba(8,18,30,.85);border-bottom:2px solid var(--cy);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.volta-site{margin-left:auto;font:700 14px "Nunito Sans",sans-serif;color:var(--cy2);text-decoration:none;border:2px solid var(--cy);border-radius:99px;padding:5px 12px;white-space:nowrap}@media(max-width:520px){.volta-site{display:none}}
header .medal{font:700 15px "Chakra Petch";background:var(--ama);color:#3a2d00;padding:6px 12px;border-radius:99px;white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:16px max(3vw,12px) 48px}
#comms{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px;scroll-margin-top:80px}
#prof{width:clamp(88px,16vw,140px);flex:none;filter:drop-shadow(0 0 18px rgba(63,224,255,.25))}
.balao{position:relative;flex:1;background:var(--card);border:2px solid var(--cy);border-radius:18px;padding:12px 16px;margin-bottom:26px;min-height:90px;box-shadow:0 0 0 4px rgba(63,224,255,.06),0 10px 30px rgba(0,0,0,.35)}
.balao::before{content:"";position:absolute;left:-14px;bottom:22px;border:12px solid transparent;border-right-color:var(--cy);border-left:0}
.balao::after{content:"";position:absolute;left:-10px;bottom:24px;border:10px solid transparent;border-right-color:var(--card);border-left:0}
.balao .quem{font:700 14px "Chakra Petch";color:var(--ama)}
.balao p{margin:4px 0 10px;font-size:17px}
.formula{font:700 clamp(17px,3vw,21px) "Chakra Petch";background:#0a2a3a;color:var(--cy2);border:1px solid var(--cy);border-radius:10px;padding:6px 12px;display:inline-block;margin:0 0 10px}
.bts{display:flex;gap:8px;flex-wrap:wrap}
button{font:700 16px "Nunito Sans",sans-serif;min-height:44px;padding:8px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;touch-action:manipulation;text-align:left}
button:hover:not(:disabled){border-color:var(--cy)}
button.pri{background:var(--ama);border-color:var(--ama);color:#2a2000}
button:focus-visible,input:focus-visible{outline:3px solid var(--ama);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.on{background:#0f3a4a;border-color:var(--cy);color:var(--cy2)}
.intro{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin-bottom:14px}
.linha{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:28px}
.linha::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:3px;background:linear-gradient(var(--cy),#5d4bd6);border-radius:3px}
.cap{position:relative;display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center;background:linear-gradient(160deg,#0f2236,#0a1420);border:1px solid var(--line);border-radius:18px;padding:12px;width:100%;color:var(--ink)}
.cap::before{content:"";position:absolute;left:-24px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg);border:3px solid var(--cy)}
.cap.feito::before{background:var(--ama);border-color:var(--ama)}
.cap svg{width:110px;height:80px;border-radius:10px;background:#050b14}

.cap h3{color:var(--cy2);margin:2px 0}
.cap small{color:var(--mut);display:block}

.palco canvas{position:absolute;inset:0;width:100%;height:100%}

.ctl input[type=range]{width:100%;height:36px;accent-color:#3fe0ff}

.leit{flex:1 1 100%;font:600 15px "Chakra Petch";color:var(--cy2);background:#071a26;border-radius:10px;padding:8px 12px}
.obs{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ama);border-radius:12px;padding:10px 14px;margin:0 0 10px}
.obs h3{font-size:15px;color:var(--ama);margin-bottom:4px}
.obs ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:2px 16px}
.obs li{padding:3px 0 3px 28px;position:relative;color:var(--mut)}
.obs li::before{content:"";position:absolute;left:0;top:6px;width:16px;height:16px;border:2px solid var(--mut);border-radius:5px}
.obs li.ok{color:var(--ink)}.obs li.ok::before{background:var(--ok);border-color:var(--ok)}
.obs li.ok::after{content:"";position:absolute;left:5px;top:8px;width:5px;height:9px;border:solid #052;border-width:0 3px 3px 0;transform:rotate(45deg)}
.palp{display:grid;gap:8px}
.palp button{width:100%}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.q .ops{display:grid;gap:6px;margin-top:8px}
.q .ops button{font-weight:400;font-size:15px;width:100%}
.q .ops button.cert{border-color:var(--ok);background:var(--okbg)}
.q .ops button.dif{border-color:var(--bad);background:var(--badbg)}
.q .fb{margin-top:8px;font-size:15px;color:var(--cy2)}
.qf{display:inline-block;margin:6px 0 2px;font:700 14px "Chakra Petch",sans-serif;background:#0a2a3a;color:var(--cy2);border-radius:8px;padding:3px 10px}
.fase{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.fase span{font:700 13px "Chakra Petch";padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.fase span.at{background:var(--cy);color:#012;border-color:var(--cy)}
.voltar{background:none;border:0;color:var(--cy);padding:0;min-height:36px}
.sub{color:var(--mut);margin:4px 0 12px}
.tab{width:100%;border-collapse:collapse;font:600 14px "Chakra Petch";color:var(--cy2)}
.tab th{color:var(--mut);font-weight:600;text-align:right;padding:2px 6px}.tab td{text-align:right;padding:2px 6px;border-top:1px solid var(--line)}
.hoje{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:6px}
.hoje div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.hoje b{font-family:"Chakra Petch";color:var(--cy2);display:block;margin-bottom:2px}
@media (prefers-reduced-motion:no-preference){#olhos{animation:pisca 4.5s infinite;transform-origin:70px 60px}#holo{animation:gira 9s linear infinite;transform-origin:70px 60px}.cena svg .pul{animation:pul 2.4s ease-in-out infinite}}
@keyframes pisca{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes pul{50%{opacity:.35}}
@media(max-width:600px){.balao p{font-size:16px}#comms{align-items:flex-start}.balao{margin-bottom:0}.balao::before,.balao::after{bottom:auto;top:28px}.palco{height:340px}.cap{grid-template-columns:76px minmax(0,1fr)}.cap svg{width:76px;height:56px}}
</style>

<script>
{
const $=s=>document.querySelector(s),tela=$('#tela');
const fmt=(x,d=0)=>Number(x).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const H_EV=4.14e-15;
let prog={},palpites={};
try{prog=JSON.parse(localStorage.getItem('eq_diario')||'{}');palpites=JSON.parse(localStorage.getItem('eq_palpites')||'{}')}catch(e){}
const salva=()=>{try{localStorage.setItem('eq_diario',JSON.stringify(prog));localStorage.setItem('eq_palpites',JSON.stringify(palpites))}catch(e){}};

function corLam(l){let r=0,g=0,b=0;
 if(l<380)return'#b48cff';
 if(l<440){r=-(l-440)/60;b=1}else if(l<490){g=(l-440)/50;b=1}else if(l<510){g=1;b=-(l-510)/20}else if(l<580){r=(l-510)/70;g=1}else if(l<645){r=1;g=-(l-645)/65}else{r=1}
 const k=l>700?.3+.7*(780-l)/80:l<420?.3+.7*(l-380)/40:1,f=v=>Math.round(255*Math.pow(Math.max(0,v*k),.8));return`rgb(${f(r)},${f(g)},${f(b)})`}
function nomeLam(l){return l<400?'ultravioleta (invisível)':l<450?'violeta':l<495?'azul':l<570?'verde':l<590?'amarelo':l<620?'laranja':l<=750?'vermelho':'infravermelho'}

/* ---------- palco ---------- */
let RAF=0,ROS=[];
function palco(el){const cv=document.createElement('canvas');el.appendChild(cv);const c=cv.getContext('2d'),S={c,W:300,H:300};
 const fit=()=>{const r=el.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);c.setTransform(d,0,0,d,0,0);S.W=r.width;S.H=r.height};
 const ro=new ResizeObserver(fit);ro.observe(el);ROS.push(ro);fit();return S}
function laco(fn){let t0=performance.now();const f=t=>{const dt=Math.max(0,Math.min(.1,(t-t0)/1000));t0=t;fn(dt,t/1000);RAF=requestAnimationFrame(f)};RAF=requestAnimationFrame(f)}
function parar(){cancelAnimationFrame(RAF);ROS.forEach(r=>r.disconnect());ROS=[]}
const ESTR=Array.from({length:120},()=>[Math.random(),Math.random(),Math.random()*1.6+.3]);
function fundo(S,grade){const{c,W,H}=S;const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05101c');g.addColorStop(1,'#020509');c.fillStyle=g;c.fillRect(0,0,W,H);
 ESTR.forEach(([a,b,r])=>{c.globalAlpha=.25+r*.3;c.fillStyle='#cfe9ff';c.fillRect(a*W,b*H,r,r)});c.globalAlpha=1;
 if(grade){c.strokeStyle='rgba(63,224,255,.06)';c.lineWidth=1;for(let x=0;x<W;x+=32){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<H;y+=32){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}}}
function T(c,s,x,y,cor,al,tam,peso){c.fillStyle=cor;c.textAlign=al||'left';c.font=`${peso||600} ${tam||13}px "Chakra Petch",sans-serif`;c.fillText(s,x,y)}
function caixa(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h)}
function hud(c,x,y,linhas,w){const lh=18,h=12+linhas.length*lh;c.fillStyle='rgba(4,14,24,.82)';caixa(c,x,y,w,h,8);c.fill();c.strokeStyle='rgba(63,224,255,.45)';c.lineWidth=1;c.stroke();linhas.forEach((l,i)=>T(c,l,x+10,y+20+i*lh,i?'#cfe3f5':'#9ff0ff','left',i?12:13,i?500:700))}
function brilho(c,x,y,r,cor){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,cor);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function onda(c,x0,y0,x1,y1,lpx,cor,amp){const L=Math.hypot(x1-x0,y1-y0),a=Math.atan2(y1-y0,x1-x0);c.save();c.translate(x0,y0);c.rotate(a);c.strokeStyle=cor;c.lineWidth=2;c.beginPath();for(let s=0;s<=L;s+=1.5){const y=Math.sin(s/lpx*6.283)*amp;s?c.lineTo(s,y):c.moveTo(s,y)}c.stroke();c.restore()}

/* ---------- conversa ---------- */
function dizer(t,bts=[],extra=''){$('#fala').textContent=t;$('#extra').innerHTML=extra;const b=$('#bts');b.innerHTML='';
 bts.forEach(([r,fn,pri])=>{const x=document.createElement('button');x.textContent=r;if(pri)x.className='pri';x.onclick=fn;b.appendChild(x)})}
function falar(falas,fim,rot='Continuar',extras={}){let i=0;const ir=()=>dizer(falas[i],[...(i?[['◀ Voltar',()=>{i--;ir()}]]:[]),i<falas.length-1?['Próximo ▶',()=>{i++;ir()},1]:[rot,fim,1]],extras[i]||'');ir()}

/* ---------- cenas históricas (hologramas) ---------- */
const G='fill="none" stroke="#3fe0ff" stroke-width="2"';
const CENAS={
 young:`<rect width="400" height="220" fill="#050b14"/><path d="M0 0H90V120H0" fill="#0b1a2a"/><path d="M10 10h70v100H10z" ${G}/><path d="M45 10v100M10 60h70" ${G} opacity=".5"/>

  <rect x="40" y="40" width="40" height="24" rx="5" fill="#1b2b3e"/><circle cx="80" cy="52" r="6" fill="#b48cff"/><path d="M86 56q6-6 12 0t12 0t12 0" stroke="#b48cff" stroke-width="2" fill="none"/>
  <rect x="260" y="120" width="110" height="70" rx="6" fill="#0f2236" stroke="#8fa8c4"/><path d="M272 138h60M272 152h80M272 166h50" stroke="#8fa8c4" stroke-width="2"/><text x="315" y="184" text-anchor="middle" font-family="Chakra Petch" font-size="11" fill="#f2c21b">E = h · f</text>
  <text x="200" y="208" text-anchor="middle" font-family="Chakra Petch" font-size="13" fill="#8fa8c4">a faísca de Hertz · o artigo de Einstein</text>`,

/* ---------- capítulos ---------- */
const CAPS=[
/* ===== 1. Young ===== */
{id:'young',ano:'1801',lugar:'Londres, Inglaterra',titulo:'A luz é uma onda?',pergunta:'O que acontece quando a luz passa por duas fendas?',
 historia:['Bem-vindos à Holoteca do Tempo da Estação Quântica! Eu sou o Prof. ExperimentaJoão. Aqui a gente visita os laboratórios onde a Física Moderna nasceu. Uma pergunta vai nos acompanhar a viagem toda: o que é a luz?',
  'Estamos em Londres, por volta de 1801. Há cem anos, o grande Isaac Newton tinha defendido que a luz é feita de partículas minúsculas, os corpúsculos. Quase todo mundo acreditava nele.',
  'Thomas Young era médico e estudava como o olho enxerga. Ele desconfiava que a luz fosse uma onda, como as ondas na água. Então montou um teste: fazer a luz do sol passar por duas fendas bem estreitas e olhar o que chega no anteparo.'],
 palpite:{p:'Antes de testar: o que você acha que vai aparecer no anteparo?',ops:['Duas faixas de luz, uma atrás de cada fenda','Várias faixas claras e escuras alternadas','Uma mancha de luz espalhada, sem faixas'],certo:1,
  revela:['Newton apostaria nisso também! Mas apareceram várias faixas claras e escuras.','Exatamente o que Young viu: várias faixas claras e escuras.','Faz sentido pensar assim, mas apareceram várias faixas claras e escuras.']},
 lab:labYoung,
 tarefas:[['obs','Observe o padrão de faixas no anteparo'],['verm','Deixe a luz vermelha e veja as faixas'],['viol','Deixe a luz violeta e compare'],['fend','Aproxime ou afaste as fendas'],['fecha','Feche uma das fendas']],
 descoberta:['Cada fenda vira uma fonte de ondas. As ondas das duas fendas se encontram: onde chega crista com crista, a luz se reforça e aparece uma franja clara. Onde chega crista com vale, elas se anulam: franja escura.',
  'Isso é interferência, e só ondas fazem isso. A distância entre as franjas depende do comprimento de onda λ, da distância até o anteparo L e da distância entre as fendas d.',
  'Por isso a luz vermelha, de λ maior, abriu as franjas, e a violeta apertou. Afastar as fendas também aproximou as franjas.',
  'No começo, muitos cientistas ingleses não aceitaram a ideia de Young. Em 1818, o francês Augustin Fresnel fez uma teoria completa e convenceu todo mundo. E nos anos 1860, James Clerk Maxwell mostrou que a luz é uma onda eletromagnética. Caso encerrado... será?'],
 formula:{1:'<div class="formula">Δy = λ · L ÷ d</div>'},
 hoje:[['Bolhas de sabão','As cores que mudam numa bolha são interferência entre a luz refletida nas duas faces da película.'],['Asas de borboleta','Algumas borboletas azuis não têm pigmento azul: a cor vem da interferência em camadas microscópicas.'],['CD e DVD','O arco-íris na face do disco vem das trilhas finíssimas que fazem a luz interferir.']],
 diario:[
  {p:'As faixas claras e escuras no anteparo aparecem por causa',ops:['da interferência entre as ondas que saem das duas fendas.','da sombra das bordas das fendas.','de partículas de luz que se acumulam em alguns pontos.'],c:0,e:'As ondas das duas fendas se somam (franja clara) ou se anulam (franja escura). Isso é interferência.'},
  {p:'Com d fixo, o que acontece com as franjas quando o comprimento de onda λ aumenta?',f:'Δy = λ · L ÷ d',ops:['Ficam mais afastadas.','Ficam mais próximas.','Não mudam.'],c:0,e:'λ está no numerador: λ maior, Δy maior. Foi o que você viu ao passar do violeta para o vermelho.'},
  {p:'Com λ = 500 nm, L = 2 m e d = 0,40 mm, qual é a distância entre as franjas?',f:'Δy = λ · L ÷ d',ops:['0,25 mm','2,5 mm','25 mm'],c:1,e:'Δy = 500 × 10⁻⁹ m · 2 m ÷ 0,4 × 10⁻³ m = 2,5 × 10⁻³ m = 2,5 mm.'},
  {p:'O experimento de Young mostrou que a luz',ops:['se comporta como onda.','é formada só por partículas, como dizia Newton.','não tem cor própria.'],c:0,e:'Interferência é comportamento de onda. Guarde isso: no próximo capítulo a história vai ficar mais complicada!'}]},
/* ===== 2. Fotoelétrico ===== */
{id:'foto',ano:'1887 → 1905',lugar:'Alemanha e Berna, Suíça',titulo:'A luz chega em pacotinhos',pergunta:'Por que uma luz forte não arranca elétrons e uma fraquinha arranca?',
 historia:['Avançamos para 1887, na Alemanha. Heinrich Hertz estudava faíscas elétricas e percebeu algo esquisito: quando a luz ultravioleta batia no aparelho, as faíscas saltavam com mais facilidade.',
  'Anos depois, Philipp Lenard descobriu o motivo: a luz arranca elétrons do metal. É o efeito fotoelétrico. E veio o mistério: os elétrons arrancados dependiam da cor da luz, e não do brilho.',
  'Pela teoria de onda, que vimos com Young, uma luz bem forte deveria sacudir mais os elétrons e arrancá-los mais fácil. Não era o que acontecia. Em 1905, um funcionário do escritório de patentes de Berna, Albert Einstein, propôs uma resposta ousada.',
  'Vamos repetir o experimento aqui na estação. A lâmpada ilumina uma placa de metal e um coletor do outro lado recebe os elétrons que saírem.'],
 palpite:{p:'Uma luz vermelha muito forte e uma luz ultravioleta bem fraquinha iluminam uma placa de sódio. Qual arranca elétrons?',ops:['A vermelha forte, porque tem mais energia','A ultravioleta fraca','As duas arrancam','Nenhuma das duas'],certo:1,
  revela:['Era o que a teoria de onda previa, e os cientistas também apostavam nisso! Mas o experimento mostrou que a vermelha forte não arranca nenhum elétron.','Acertou o que o experimento mostrou: a ultravioleta fraca arranca e a vermelha forte não.','Parecia razoável, mas a vermelha, mesmo fortíssima, não arrancou nenhum elétron.','A ultravioleta fraquinha arrancou, sim! A vermelha é que não arrancou nenhum.']},
 lab:labFoto,
 tarefas:[['verm','Ilumine o sódio com luz vermelha no brilho máximo'],['limiar','Descubra a cor em que os elétrons começam a sair do sódio'],['brilho','Com elétrons saindo, mude bastante o brilho'],['zinco','Troque para o zinco e descubra que luz ele precisa']],
 descoberta:['Einstein, inspirado numa ideia de Max Planck de 1900, disse: a luz chega em pacotinhos de energia, os fótons. Cada fóton entrega toda a sua energia a um único elétron.',
  'A energia de cada fóton depende só da frequência: E = h · f. A constante de Planck h vale cerca de 4,14 × 10⁻¹⁵ eV · s. Frequência maior, como no violeta e no ultravioleta, quer dizer fóton com mais energia.',
  'Cada metal segura seus elétrons com uma energia mínima, a função trabalho: 2,3 eV no sódio e 4,3 eV no zinco. Fóton abaixo disso não arranca nada, não importa quantos cheguem. O brilho só muda quantos fótons chegam por segundo.',
  'Em 1916, Robert Millikan passou anos tentando provar que Einstein estava errado e acabou confirmando a ideia. E sabe pelo que Einstein ganhou o Prêmio Nobel? Não foi pela Relatividade: foi pelo efeito fotoelétrico!',
  'Agora temos um problema: Young mostrou que a luz é onda. Einstein mostrou que a luz chega em partículas. Qual dos dois está certo? Guarde essa pergunta para o último capítulo.'],
 formula:{1:'<div class="formula">E = h · f &nbsp;·&nbsp; h ≈ 4,14 × 10⁻¹⁵ eV · s</div>'},
 hoje:[['Parques solares de Arinos','Os painéis transformam a energia dos fótons do Sol em corrente elétrica, liberando elétrons no material.'],['Postes que acendem sozinhos','Um sensor de luz percebe quando os fótons do dia acabam e liga a lâmpada.'],['Câmera do celular','Cada pixel do sensor conta os elétrons liberados pelos fótons que chegam.']],
 diario:[
  {p:'Por que a luz vermelha, mesmo no brilho máximo, não arrancou elétrons do sódio?',ops:['Cada fóton vermelho tem energia menor que a função trabalho do sódio (2,3 eV).','A luz vermelha não chega até a placa.','O sódio é vermelho e reflete a luz vermelha.'],c:0,e:'Cada elétron recebe a energia de um único fóton. Se esse fóton tem pouca energia, não adianta mandar muitos.'},
  {p:'Qual é a energia de um fóton de frequência 1,0 × 10¹⁵ Hz?',f:'E = h · f = 4,14 × 10⁻¹⁵ · f',ops:['0,41 eV','4,14 eV','41,4 eV'],c:1,e:'E = 4,14 × 10⁻¹⁵ eV · s × 1,0 × 10¹⁵ Hz = 4,14 eV. Pouco abaixo dos 4,3 eV do zinco!'},
  {p:'Numa luz que já arranca elétrons, aumentar o brilho faz',ops:['cada elétron sair com muito mais energia.','sair mais elétrons por segundo.','os elétrons pararem de sair.'],c:1,e:'Mais brilho é mais fótons por segundo, então mais elétrons por segundo. A energia de cada um continua dependendo só da frequência.'},
  {p:'O efeito fotoelétrico mostrou que a luz',ops:['se comporta como partícula: chega em pacotes de energia, os fótons.','é só uma onda, como Young pensava.','não transporta energia.'],c:0,e:'Partícula aqui, onda no experimento de Young. Essa tensão é o fio da nossa história.'}]},
/* ===== 3. Relatividade ===== */
{id:'gemeas',ano:'1905',lugar:'Berna, Suíça',titulo:'O tempo não é igual para todos',pergunta:'Se uma gêmea viaja quase na velocidade da luz, quem envelhece mais?',
 historia:['Ainda em 1905, ainda com Einstein. Aos 16 anos ele se perguntava: o que eu veria se corresse ao lado de um raio de luz?',
  'Em 1887, Michelson e Morley tinham medido a velocidade da luz em várias direções, esperando ver diferença por causa do movimento da Terra. Não acharam diferença nenhuma.',
  'Einstein levou isso a sério e criou dois postulados. Primeiro: as leis da Física são as mesmas para quem está parado ou em movimento com velocidade constante. Segundo: a velocidade da luz no vácuo, c ≈ 300 000 km/s, é a mesma para qualquer observador.',
  'Em 1911, o francês Paul Langevin imaginou uma história para mostrar as consequências disso: duas gêmeas, uma fica na Terra e a outra viaja numa nave muito rápida. Vamos pilotar essa história com Ana e Bia, de 20 anos.'],
 palpite:{p:'Bia viaja quase na velocidade da luz até uma estrela e volta. No reencontro, quem está mais velha?',ops:['Ana, que ficou na Terra','Bia, que viajou','As duas estão com a mesma idade'],certo:0,
  revela:['Foi o que a viagem mostrou: Ana envelheceu muito mais que Bia.','Na verdade foi o contrário: quem viajou envelheceu menos.','Parece o mais lógico, mas não: Ana ficou bem mais velha que Bia.']},
 lab:labGemeas,
 tarefas:[['lenta','Faça uma viagem lenta (até 0,5 c)'],['rapida','Faça uma viagem muito rápida (0,9 c ou mais)'],['manobra','Observe a manobra de retorno na estrela'],['farol','Repare na luz do farol durante a viagem']],
 descoberta:['Para a luz ter a mesma velocidade para todos, o tempo precisa passar diferente para cada um. Para quem se move muito rápido, o tempo passa mais devagar: é a dilatação do tempo.',
  'O fator de Lorentz, γ (gama), diz quantas vezes o tempo de Bia ficou mais lento. Na viagem lenta, γ era quase 1 e a diferença foi pequena. Perto da luz, γ disparou.',
  'Para Bia, a distância até a estrela também ficou mais curta, dividida por γ. É a contração do comprimento, e foi por isso que ela chegou tão rápido no relógio dela.',
  'E o paradoxo? Bia não poderia dizer que quem se afastou foi a Terra? Não, porque só Bia acelerou, freou e virou a nave para voltar. Ela mudou de referencial. Ana ficou no mesmo referencial o tempo todo. As situações não são simétricas.',
  'Nesse mesmo ano de 1905, Einstein ainda mostrou que massa pode virar energia: E = m · c². É essa ideia que explica a energia do Sol.'],
 formula:{1:'<div class="formula">t<sub>Bia</sub> = t<sub>Ana</sub> ÷ γ</div>',2:'<div class="formula">L<sub>Bia</sub> = L ÷ γ</div>',4:'<div class="formula">E = m · c²</div>'},
 hoje:[['GPS do celular','Os relógios dos satélites andam num ritmo diferente dos relógios no chão. Sem a correção da Relatividade, o GPS erraria quilômetros por dia.'],['Relógios em aviões','Em 1971, Hafele e Keating levaram relógios atômicos em voos ao redor do mundo e mediram a diferença de tempo prevista.'],['Múons do espaço','Partículas criadas no alto da atmosfera chegam ao chão porque, para elas, o tempo passa mais devagar.']],
 diario:[
  {p:'No reencontro, por que Bia está mais nova que Ana?',f:'t_Bia = t_Ana ÷ γ',ops:['Para quem se move muito rápido, o tempo passa mais devagar.','A nave tinha um relógio quebrado.','Bia dormiu durante a viagem.'],c:0,e:'É a dilatação do tempo. Na sua tabela de viagens, quanto mais perto de c, maior a diferença entre as idades.'},
  {p:'Por que a situação das gêmeas não é simétrica?',ops:['Ana estava na Terra, onde o tempo não existe.','Só Bia acelerou, freou e inverteu o sentido do movimento, mudando de referencial.','A velocidade da luz é diferente para cada gêmea.'],c:1,e:'A manobra de retorno, que você viu na estrela, é o que diferencia as duas.'},
  {p:'O farol da nave aponta para a frente. Que velocidade Ana mede para essa luz?',ops:['c mais a velocidade da nave.','c, a mesma para qualquer observador.','c menos a velocidade da nave.'],c:1,e:'É o segundo postulado de Einstein: a velocidade da luz no vácuo é a mesma para todos.'},
  {p:'Por que não percebemos esses efeitos no dia a dia?',ops:['Porque a Relatividade foi provada errada.','Porque as velocidades do cotidiano são muito pequenas comparadas à da luz.','Porque eles só acontecem fora da Terra.'],c:1,e:'Um carro a 30 m/s tem γ praticamente igual a 1. Só perto de c os efeitos ficam grandes.'}]},
/* ===== 4. Bohr ===== */
{id:'bohr',ano:'1913',lugar:'Copenhague, Dinamarca',titulo:'Os degraus do átomo',pergunta:'Por que cada elemento brilha com uma cor só dele?',
 historia:['Agora estamos em 1913. Mas a história começa antes: em 1859, Robert Bunsen e Gustav Kirchhoff jogavam sais na chama e olhavam a luz por um prisma, o espectroscópio.',
  'Cada elemento mostrava linhas de cor sempre nos mesmos lugares, como uma impressão digital. Em 1868, viram no Sol uma linha que não era de nenhum elemento conhecido. Era o hélio, descoberto no Sol antes de ser achado na Terra!',
  'Ninguém sabia explicar essas linhas. Em 1911, Ernest Rutherford descobriu que o átomo tem um núcleo pequeno com elétrons em volta. Só que, pela física da época, o elétron deveria perder energia e cair no núcleo.',
  'O dinamarquês Niels Bohr juntou a ideia dos pacotes de energia de Planck e Einstein com o átomo de Rutherford. Vamos testar com fogos de artifício: cada foguete leva um sal diferente.'],
 palpite:{p:'Quando cai sal de cozinha (cloreto de sódio) na chama do fogão, de que cor a chama fica?',ops:['Amarela','Vermelha','Verde','Azul'],certo:0,
  revela:['Isso mesmo: o sódio deixa a chama amarela. Você vai ver por quê.','Vermelha é a cor do estrôncio. O sódio deixa a chama amarela.','Verde é a cor do cobre. O sódio deixa a chama amarela.','A chama do gás já é azulada, mas o sódio deixa a chama amarela.']},
 lab:labBohr,
 tarefas:[['s0','Lance um foguete de sódio'],['s1','Lance um foguete de estrôncio'],['s2','Lance um foguete de cobre'],['esp','Compare as linhas no espectroscópio']],
 descoberta:['Bohr propôs que o elétron só pode ocupar certos níveis de energia, como degraus de uma escada. Não existe meio degrau.',
  'Com o calor da explosão, o elétron absorve energia e sobe de nível. Logo depois ele volta para o nível de menor energia e emite um fóton com a energia exata da diferença entre os degraus.',
  'Energia definida quer dizer frequência definida e cor definida. Cada elemento tem seus próprios degraus, por isso cada um tem suas linhas no espectroscópio: amarelo no sódio, vermelho no estrôncio, verde-azulado no cobre.'],
 formula:{1:'<div class="formula">E<sub>fóton</sub> = E<sub>alto</sub> − E<sub>baixo</sub> = h · f</div>'},
 hoje:[['Fogos de artifício','Cada cor do Réveillon é um elemento diferente: estrôncio no vermelho, sódio no amarelo, cobre e bário nos verdes.'],['Postes amarelos','As lâmpadas de vapor de sódio da iluminação pública brilham no amarelo do sódio.'],['Química das estrelas','Pelas linhas do espectro, os astrônomos sabem do que são feitas estrelas que nunca vamos visitar.']],
 diario:[
  {p:'No modelo de Bohr, o elétron só pode ocupar',ops:['qualquer energia, como numa rampa.','certos níveis de energia, como degraus de uma escada.','o núcleo do átomo.'],c:1,e:'Os níveis são quantizados: só alguns valores de energia são permitidos.'},
  {p:'A luz colorida dos fogos é emitida quando o elétron',ops:['volta para um nível de menor energia e emite um fóton.','sobe para um nível de maior energia.','sai do átomo e vira um próton.'],c:0,e:'Ao subir ele absorve energia (do calor). A luz sai quando ele volta para baixo.'},
  {p:'Por que cada sal dá uma cor diferente?',ops:['Porque o sal pinta a fumaça.','Porque cada foguete explode numa altura diferente.','Cada elemento tem diferenças de energia próprias entre os níveis, então emite fótons de energia definida.'],c:2,e:'Degraus diferentes, fótons diferentes, cores diferentes: a impressão digital do elemento.'},
  {p:'O fóton amarelo do sódio tem cerca de 2,1 eV. O fóton verde-azulado do cobre tem',f:'E = h · f',ops:['mais energia, porque tem frequência maior.','menos energia, porque tem frequência menor.','a mesma energia, porque todo fóton é igual.'],c:0,e:'O verde-azulado tem frequência maior que o amarelo, então mais energia: cerca de 2,4 eV.'}]},
/* ===== 5. Dualidade ===== */
{id:'dual',ano:'1924 → 1989',lugar:'Paris, Nova York e Tóquio',titulo:'Onda e partícula',pergunta:'Afinal, o que é a luz? E o que é um elétron?',
 historia:['Último capítulo. Lembra do nosso problema? Young mostrou que a luz é onda. Einstein mostrou que a luz chega em partículas.',
  'Em 1924, o francês Louis de Broglie teve uma ideia ousada na tese de doutorado: se a luz, que é onda, se comporta como partícula, talvez as partículas também se comportem como ondas!',
  'Em 1927, nos Estados Unidos, Davisson e Germer jogaram elétrons num cristal e viram um padrão de onda. E em 1989, no Japão, a equipe de Akira Tonomura fez o experimento de Young com elétrons disparados um de cada vez.',
  'Vamos repetir esse experimento. O canhão dispara elétrons, que têm massa e carga, um de cada vez, contra duas fendas. Cada elétron que chega acende um pontinho na tela.'],
 palpite:{p:'Depois de muitos elétrons, um de cada vez, que desenho aparece na tela?',ops:['Duas faixas, uma atrás de cada fenda','Várias faixas claras e escuras, como no experimento de Young','Pontinhos espalhados ao acaso, sem desenho'],certo:1,
  revela:['É o que esperaríamos de bolinhas. Mas os elétrons formaram várias faixas, como as ondas de Young!','Isso mesmo: os elétrons desenharam as franjas de interferência, como a luz de Young.','No começo parece mesmo aleatório. Mas, com muitos elétrons, apareceram as franjas de interferência!']},
 lab:labDual,
 tarefas:[['um','Dispare um único elétron e veja como ele chega'],['muitos','Junte 400 elétrons sem o detector'],['det','Ligue o detector nas fendas e junte 300 elétrons']],
 descoberta:['Cada elétron chegou como um pontinho, num lugar só: comportamento de partícula. Mas, juntos, eles desenharam faixas de interferência: comportamento de onda. Ele passou pelas duas fendas como onda!',

 $('#lan').onclick=()=>fila.push(sel);
 $('#fin').onclick=()=>{fila.push(1,0,2);dizer('Grande final do Réveillon de Arinos! Vermelho, amarelo e verde: três elementos, três conjuntos de degraus.',[])};
 pinta();dizer('Escolha um sal e lance. Olhe o átomo à esquerda e o espectroscópio embaixo do céu.',[]);
 laco((dt,t)=>{const{c,W,H}=S;fundo(S,false);
  if(est==='pronto'&&fila.length){at=fila.shift();est='sobe';ta=0}

  c.fillStyle='#0a1420';for(let i=0;i<14;i++){const x=W*.48+i*(W*.52/14),h=12+((i*37)%5)*9;c.fillRect(x,H*.78-h,W*.52/14-3,h)}
  // espectroscópio
  const ex0=W*.5,ew=W*.47,ey=H*.82,eh=H*.12;const gr=c.createLinearGradient(ex0,0,ex0+ew,0);[[0,'#7a3cff'],[.25,'#2f7fff'],[.45,'#3fd17a'],[.62,'#ffd34d'],[.8,'#ff8a3d'],[1,'#ff3d3d']].forEach(([o,k])=>gr.addColorStop(o,k));

  const lx=W*.36,e1=H*.86,e2=e1-s.E*H*.15;c.strokeStyle='#cfe3f5';c.lineWidth=2;[e1,e2].forEach(y=>{c.beginPath();c.moveTo(lx-22,y);c.lineTo(lx+22,y);c.stroke()});T(c,fmt(s.E,1)+' eV',lx-26,(e1+e2)/2+4,'#f2c21b','right',11,700);T(c,'degraus',lx,e1+14,'#8fa8c4','center',10);

/* ================= LAB: dualidade ================= */
function labDual(A){const S=A.S;let det=false,raj=false,n=0,pontos=[],voo=[],acc=0,marcos={};const NB=90,hist=new Array(NB).fill(0);
 A.ctl.innerHTML=`<div class="grupo"><button class="pri" id="um">Disparar 1 elétron</button><button id="raj">Rajada: desligada</button><button id="det">Detector nas fendas: desligado</button><button id="lim">Limpar a tela</button></div><div class="leit" id="ld"></div>`;
 const limpa=()=>{pontos=[];hist.fill(0);n=0};
 $('#um').onclick=()=>disparar(true);$('#raj').onclick=()=>{raj=!raj;$('#raj').textContent='Rajada: '+(raj?'ligada':'desligada');$('#raj').classList.toggle('on',raj)};
 $('#det').onclick=()=>{det=!det;$('#det').textContent='Detector nas fendas: '+(det?'ligado':'desligado');$('#det').classList.toggle('on',det);limpa();
  dizer(det?'Detector ligado: agora sabemos por qual fenda cada elétron passa. Limpei a tela. Dispare de novo e compare!':'Detector desligado. Tela limpa para recomeçar.',[])};
 $('#lim').onclick=limpa;
 const amostra=()=>{for(;;){const y=(Math.random()*2-1)*15;let P;if(det){P=(Math.exp(-((y-1.6)**2)/22)+Math.exp(-((y+1.6)**2)/22))/1.6}else{const b=y/4.6,s=Math.abs(b)<1e-6?1:Math.sin(b)/b;P=s*s*Math.cos(Math.PI*y/3.8)**2}if(Math.random()<P)return y}};
 const disparar=un=>voo.push({k:0,y:amostra(),fenda:Math.random()<.5?-1:1,un});
 dizer('Comece disparando um elétron só e veja como ele chega. Depois ligue a rajada.',[]);
 laco((dt,t)=>{const{c,W,H}=S;fundo(S,true);const cy=H*.5,gx=W*.08,bx=W*.36,sx=W*.7,esc=(H*.44)/15,sep=22;
  if(raj){acc+=dt*45;while(acc>=1){acc--;disparar(false)}}
  c.fillStyle='#1b2b3e';caixa(c,gx-20,cy-16,44,32,6);c.fill();c.fillStyle='#3fe0ff';c.fillRect(gx+24,cy-4,8,8);T(c,'canhão de elétrons',gx+4,cy+32,'#8fa8c4','center',11);
  c.fillStyle='#8fa8c4';c.fillRect(bx-4,0,8,cy-sep-4);c.fillRect(bx-4,cy-sep+4,8,2*sep-8);c.fillRect(bx-4,cy+sep+4,8,H-cy-sep-4);
  if(det){[-1,1].forEach(s=>{c.fillStyle='#f2c21b';caixa(c,bx+6,cy+s*sep-6,14,12,3);c.fill()});T(c,'detector',bx+30,cy-sep-12,'#f2c21b','center',10,700)}
  c.fillStyle='#0a1622';c.fillRect(sx,0,36,H);c.strokeStyle='#cfe3f5';c.strokeRect(sx,0,36,H);
  pontos.forEach(([y,j])=>{c.fillStyle='rgba(159,240,255,.85)';c.fillRect(sx+2+j*31,cy+y*esc,2,2)});
  const hx=sx+44,hw=W-hx-10,mx=Math.max(1,...hist),bh=H/NB;hist.forEach((v,i)=>{c.fillStyle='rgba(63,224,255,.55)';c.fillRect(hx,i*bh,v/mx*hw,bh-1)});
  voo=voo.filter(e=>{e.k+=dt/.7;const ex=gx+32+(bx-gx-32)*Math.min(1,e.k/.45);
   if(e.k<.45){brilho(c,ex,cy,10,'rgba(63,224,255,.8)');c.fillStyle='#e9fbff';c.beginPath();c.arc(ex,cy,3,0,7);c.fill()}
   else{const q=(e.k-.45)/.55;
    if(det){const y0=cy+e.fenda*sep,yt=cy+e.y*esc,x=bx+(sx-bx)*q,y=y0+(yt-y0)*q;brilho(c,x,y,10,'rgba(63,224,255,.8)');c.fillStyle='#e9fbff';c.beginPath();c.arc(x,y,3,0,7);c.fill();if(q<.2){c.fillStyle='rgba(242,194,27,.8)';c.beginPath();c.arc(bx+13,y0,8,0,7);c.fill()}}
    else{const r=(sx-bx)*q;c.strokeStyle=`rgba(63,224,255,${.5*(1-q)})`;c.lineWidth=1.5;[-1,1].forEach(s=>{c.beginPath();c.arc(bx,cy+s*sep,r,-1.2,1.2);c.stroke()})}}
   if(e.k>=1){pontos.push([e.y,Math.random()]);if(pontos.length>2500)pontos.shift();const b=Math.floor((cy+e.y*esc)/bh);if(b>=0&&b<NB)hist[b]++;n++;
    if(e.un&&!marcos.um){marcos.um=1;A.marca('um');brilho(c,sx+18,cy+e.y*esc,20,'rgba(255,255,255,.9)');dizer(det?'Um pontinho, num lugar só.':'Viu? Na ida parecia uma onda passando pelas duas fendas, mas o elétron chegou como um pontinho, num lugar só. Coisa de partícula! Agora ligue a rajada.',[])}

    if(det&&n>=300&&!marcos.det){marcos.det=1;A.marca('det');dizer('Com o detector ligado, as franjas sumiram! Saber o caminho de cada elétron acaba com a interferência.',[])}
    return false}return true});
  $('#ld').textContent=`Elétrons na tela: ${n} · ${det?'detector ligado: sabemos a fenda de cada um':'detector desligado'}`;
