*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#10324a 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#1a1840 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,sans-serif;overflow-x:clip;min-height:100vh}

header{display:flex;align-items:center;gap:12px;padding:12px max(4vw,14px);background:rgba(8,18,30,.85);border-bottom:2px solid var(--cy);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.volta-site{margin-left:auto;font:700 14px "Nunito Sans",sans-serif;color:var(--cy2);text-decoration:none;border:2px solid var(--cy);border-radius:99px;padding:5px 12px;white-space:nowrap}@media(max-width:520px){.volta-site{display:none}}
header .medal{font:700 15px "Chakra Petch";background:var(--ama);color:#3a2d00;padding:6px 12px;border-radius:99px;white-space:nowrap}

.balao{position:relative;flex:1;background:var(--card);border:2px solid var(--cy);border-radius:18px;padding:12px 16px;margin-bottom:26px;min-height:90px;box-shadow:0 0 0 4px rgba(63,224,255,.06),0 10px 30px rgba(0,0,0,.35)}

button:disabled{opacity:.4;cursor:default}
button.on{background:#0f3a4a;border-color:var(--cy);color:var(--cy2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}

.missao .n{font:700 18px "Chakra Petch";width:38px;height:38px;border-radius:10px;background:var(--cy);color:#012;display:grid;place-items:center;flex:none}

.palco{background:#030810;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;height:clamp(300px,54vw,480px);touch-action:manipulation}
.palco canvas{position:absolute;inset:0;width:100%;height:100%}
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}

.obj{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ama);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-weight:700}
.obj.feito{border-left-color:var(--ok)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.q.ok{border-color:var(--ok);background:var(--okbg)}.q.ok .err{color:var(--ok)}.q.no{border-color:var(--bad);background:var(--badbg)}
.q label{display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer}.q input{width:20px;height:20px;accent-color:#3fe0ff;flex:none}
.qf{display:inline-block;margin:6px 0 2px;font:700 14px "Chakra Petch",sans-serif;background:#0a2a3a;color:var(--cy2);border-radius:8px;padding:3px 10px}
.fase{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.fase span{font:700 13px "Chakra Petch";padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.fase span.at{background:var(--cy);color:#012;border-color:var(--cy)}
.voltar{background:none;border:0;color:var(--cy);padding:0;min-height:36px}
.sub{color:var(--mut);margin:4px 0 12px}
.medalha{text-align:center;background:var(--card);border:2px solid var(--ama);border-radius:18px;padding:24px}
.medalha svg{width:100px;height:100px}.estrelas{font-size:40px;color:var(--ama);letter-spacing:6px}
.err{color:var(--bad);font-size:14px;min-height:18px}
.nota{font-size:13px;color:var(--mut);margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){#olhos{animation:pisca 4.5s infinite;transform-origin:70px 60px}#holo{animation:gira 9s linear infinite;transform-origin:70px 60px}}
@keyframes pisca{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

@media(max-width:600px){.balao p{font-size:16px}#comms{align-items:flex-start}.balao{margin-bottom:0}.balao::before,.balao::after{bottom:auto;top:28px}.palco{height:340px}}

<script>
{
const $=s=>document.querySelector(s),tela=$('#tela');
const fmt=(x,d=0)=>Number(x).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const alt=(certa,erradas,pos)=>{const a=[...erradas];a.splice(pos,0,certa);return{a,c:pos}};
const H_EV=4.14e-15;
let prog={};try{prog=JSON.parse(localStorage.getItem('eq_prog')||'{}')}catch(e){prog={}}
const salva=()=>{try{localStorage.setItem('eq_prog',JSON.stringify(prog))}catch(e){}};

/* ---------- cor de um comprimento de onda ---------- */
function corLam(l){let r=0,g=0,b=0;
 if(l<380)return'#b48cff';
 if(l<440){r=-(l-440)/60;b=1}else if(l<490){g=(l-440)/50;b=1}else if(l<510){g=1;b=-(l-510)/20}else if(l<580){r=(l-510)/70;g=1}else if(l<645){r=1;g=-(l-645)/65}else{r=1}
 const k=l>700?.3+.7*(780-l)/80:l<420?.3+.7*(l-380)/40:1,f=v=>Math.round(255*Math.pow(Math.max(0,v*k),.8));return`rgb(${f(r)},${f(g)},${f(b)})`}
function nomeLam(l){return l<400?'ultravioleta (invisível)':l<450?'violeta':l<495?'azul':l<570?'verde':l<590?'amarelo':l<620?'laranja':l<=750?'vermelho':'infravermelho'}

/* ---------- palco (canvas) ---------- */
let RAF=0,ROS=[],KEY=null;
function palco(el){const cv=document.createElement('canvas');el.appendChild(cv);const c=cv.getContext('2d'),S={c,W:300,H:300};
 const fit=()=>{const r=el.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);c.setTransform(d,0,0,d,0,0);S.W=r.width;S.H=r.height};
 const ro=new ResizeObserver(fit);ro.observe(el);ROS.push(ro);fit();return S}
function laco(fn){let t0=performance.now();const f=t=>{const dt=Math.min(.05,(t-t0)/1000);t0=t;fn(dt,t/1000);RAF=requestAnimationFrame(f)};RAF=requestAnimationFrame(f)}
function parar(){cancelAnimationFrame(RAF);ROS.forEach(r=>r.disconnect());ROS=[];if(KEY){removeEventListener('keydown',KEY);KEY=null}}
const ESTR=Array.from({length:120},()=>[Math.random(),Math.random(),Math.random()*1.6+.3]);
function fundo(S,grade){const{c,W,H}=S;const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05101c');g.addColorStop(1,'#020509');c.fillStyle=g;c.fillRect(0,0,W,H);
 ESTR.forEach(([a,b,r])=>{c.globalAlpha=.25+r*.3;c.fillStyle='#cfe9ff';c.fillRect(a*W,b*H,r,r)});c.globalAlpha=1;
 if(grade){c.strokeStyle='rgba(63,224,255,.06)';c.lineWidth=1;for(let x=0;x<W;x+=32){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<H;y+=32){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}}}
function T(c,s,x,y,cor,al,tam,peso){c.fillStyle=cor;c.textAlign=al||'left';c.font=`${peso||600} ${tam||13}px "Chakra Petch",sans-serif`;c.fillText(s,x,y)}
function caixa(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h)}
function hud(c,x,y,linhas,w){const lh=18,h=12+linhas.length*lh;c.fillStyle='rgba(4,14,24,.82)';caixa(c,x,y,w,h,8);c.fill();c.strokeStyle='rgba(63,224,255,.45)';c.lineWidth=1;c.stroke();linhas.forEach((l,i)=>T(c,l,x+10,y+20+i*lh,i?'#cfe3f5':'#9ff0ff','left',i?12:13,i?500:700))}
function brilho(c,x,y,r,cor){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,cor);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function onda(c,x0,y0,x1,y1,lpx,cor,amp){const L=Math.hypot(x1-x0,y1-y0),a=Math.atan2(y1-y0,x1-x0);c.save();c.translate(x0,y0);c.rotate(a);c.strokeStyle=cor;c.lineWidth=2;c.beginPath();for(let s=0;s<=L;s+=1.5){const y=Math.sin(s/lpx*6.283)*amp;s?c.lineTo(s,y):c.moveTo(s,y)}c.stroke();c.restore()}

/* ---------- conversa ---------- */
let ultimaFala='';
function dizer(t,bts=[],extra=''){ultimaFala=t;$('#fala').textContent=t;$('#extra').innerHTML=extra;const b=$('#bts');b.innerHTML='';
 bts.forEach(([r,fn,pri])=>{const x=document.createElement('button');x.textContent=r;if(pri)x.className='pri';x.onclick=fn;b.appendChild(x)})}
function falar(falas,fim,rot='Vamos lá!',extra=''){let i=0;const ir=()=>dizer(falas[i],[...(i?[['◀ Voltar',()=>{i--;ir()}]]:[]),i<falas.length-1?['Próximo ▶',()=>{i++;ir()},1]:[rot,fim,1]],i===falas.length-1?extra:'');ir()}

/* ---------- setores e missões ---------- */
const SETORES=[
 {id:'rel',nome:'Setor Relatividade',temas:'Velocidade da luz, dilatação do tempo, paradoxo dos gêmeos, contração do comprimento',
  ico:'<circle cx="32" cy="32" r="26" fill="#0a2a3a" stroke="#3fe0ff" stroke-width="2"/><path d="M32 14v18l12 8" stroke="#f2c21b" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M8 50l14-6-2 8z" fill="#9ff0ff"/>'},
 {id:'fot',nome:'Setor Fótons',temas:'Efeito fotoelétrico, fóton, energia E = h · f',
  ico:'<rect x="40" y="10" width="8" height="44" rx="2" fill="#8fa8c4"/><path d="M6 20q4-6 8 0t8 0 8 0" stroke="#b48cff" stroke-width="3" fill="none"/><circle cx="56" cy="22" r="5" fill="#3fe0ff"/><path d="M48 30l10-6" stroke="#3fe0ff" stroke-width="2"/>'},
 {id:'ond',nome:'Setor Ondas e Partículas',temas:'Experimento de Thomas Young, interferência, dualidade onda-partícula',
  ico:'<rect x="26" y="6" width="6" height="18" fill="#8fa8c4"/><rect x="26" y="28" width="6" height="8" fill="#8fa8c4"/><rect x="26" y="40" width="6" height="18" fill="#8fa8c4"/>'+[0,1,2,3,4,5].map(i=>`<rect x="50" y="${6+i*9}" width="8" height="5" fill="#3fe0ff" opacity="${[.3,.7,1,1,.7,.3][i]}"/>`).join('')+'<path d="M6 32h14" stroke="#ff6b6b" stroke-width="3"/>'},
 {id:'ato',nome:'Setor Átomos',temas:'Modelo de Bohr, níveis de energia, cores dos fogos de artifício',
  ico:'<circle cx="32" cy="32" r="6" fill="#ff6b6b"/><circle cx="32" cy="32" r="14" fill="none" stroke="#3fe0ff" stroke-dasharray="3 3"/><circle cx="32" cy="32" r="24" fill="none" stroke="#3fe0ff" stroke-dasharray="3 3"/><circle cx="56" cy="32" r="4" fill="#9ff0ff"/><path d="M50 12l4 4m-8-6l1 5m9 3l-5 1" stroke="#f2c21b" stroke-width="2"/>'}
];

const MISSOES=[
/* ===== 1. Paradoxo dos gêmeos ===== */
{id:'gemeas',setor:'rel',titulo:'A viagem das gêmeas',conceito:'dilatação do tempo, contração do comprimento e o paradoxo dos gêmeos',
 obj:'Leve Bia até a estrela Kepler-Q, a 20 anos-luz, e traga de volta para a Terra envelhecendo no máximo 12 anos.',
 briefing:['Bem-vinda, tripulação! Eu sou o Prof. ExperimentaJoão, chefe da Estação Quântica. Aqui a gente pilota naves quase tão rápidas quanto a luz.',
  'As gêmeas Ana e Bia têm 20 anos. Ana fica na Terra. Bia vai pilotar a nave até a estrela Kepler-Q, a 20 anos-luz daqui, e voltar.',
  'Sua missão: escolher a velocidade da nave e fazer a manobra de retorno na hora certa. Bia só pode envelhecer, no máximo, 12 anos na viagem toda.'],
 aula:['Primeiro postulado de Einstein: as leis da Física são as mesmas para quem está parado ou em movimento com velocidade constante.',
  'Segundo postulado: a velocidade da luz no vácuo é a mesma para todos os observadores, c ≈ 300 000 km/s. Se a nave acende o farol, Ana e Bia medem a luz com a mesma velocidade c.',
  'Para isso dar certo, o tempo não pode passar igual para todos. Para quem se move muito rápido, o tempo passa mais devagar. Isso é a dilatação do tempo.',
  'O fator de Lorentz, γ (gama), diz quantas vezes o tempo de Bia fica mais lento. Perto da velocidade da luz, γ cresce muito. O tempo de Bia é o tempo de Ana dividido por γ.',
  'E tem mais: para Bia, a distância até a estrela fica mais curta, também dividida por γ. É a contração do comprimento.',
  'O paradoxo: Bia não poderia dizer que quem se moveu foi a Terra? Não! Só Bia acelera, freia e vira a nave para voltar. Ela muda de referencial. Ana fica no mesmo referencial o tempo todo.'],
 formula:'<div class="formula">t<sub>Bia</sub> = t<sub>Ana</sub> ÷ γ &nbsp;·&nbsp; L<sub>Bia</sub> = L ÷ γ</div>',
 lab:labGemeas,
 perg:d=>[
  {p:`Na sua viagem a ${fmt(d.v,2)} c, Ana chegou a ${fmt(d.ana,1)} anos. Com quantos anos Bia voltou?`,f:'t_Bia = t_Ana ÷ γ',...alt(fmt(d.bia,1)+' anos',[fmt(d.ana,1)+' anos, igual a Ana',fmt(20+(d.ana-20)*d.g,1)+' anos'],1)},

  A.obj(idx<5?`Pedido ${idx+1} de 5 da prefeitura: <b style="color:${corLam(SAIS[ped[idx]].lam)}">${SAIS[ped[idx]].cor.toUpperCase()}</b>. Escolha o sal e lance.`:'Show completo!',idx>=5)};
 A.ctl.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sel=+b.dataset.s;pinta()});
 $('#lan').onclick=()=>{if(est!=='pronto'||idx>=5)return;est='sobe';ta=0;fog={s:sel,y:1}};
 pinta();
 laco((dt,t)=>{const{c,W,H}=S;fundo(S,false);const ax=W*.24,ay=H*.46,s=SAIS[fog?fog.s:sel],cor=corLam(s.lam);
  // céu e cidade
  c.fillStyle='#0a1420';for(let i=0;i<14;i++){const x=W*.48+i*(W*.52/14),h=12+((i*37)%5)*9;c.fillRect(x,H-h,W*.52/14-3,h)}
  T(c,'Arinos',W*.74,H-6,'#8fa8c4','center',11);

  c.fillStyle='rgba(4,14,24,.8)';caixa(c,8,8,W*.44,H-16,12);c.fill();c.strokeStyle='rgba(63,224,255,.35)';c.stroke();
  T(c,'Átomo de '+s.n.toLowerCase(),ax,30,'#9ff0ff','center',13,700);
  const r1=Math.min(W,H)*.07,r2=r1*2.1;
  [r1,r2].forEach((r,i)=>{c.strokeStyle='rgba(159,240,255,.4)';c.setLineDash([3,4]);c.beginPath();c.arc(ax,ay,r,0,7);c.stroke();c.setLineDash([]);T(c,'n = '+(i+1),ax+r+4,ay-4,'#8fa8c4','left',10)});
  brilho(c,ax,ay,r1*.7,'rgba(255,107,107,.6)');c.fillStyle='#ff6b6b';c.beginPath();c.arc(ax,ay,r1*.35,0,7);c.fill();
  // escada de energia
  const ex=W*.36,e1=H*.82,e2=H*.82-s.E*H*.16;c.strokeStyle='#cfe3f5';c.lineWidth=2;[e1,e2].forEach(y=>{c.beginPath();c.moveTo(ex-24,y);c.lineTo(ex+24,y);c.stroke()});
  T(c,fmt(s.E,1)+' eV',ex-28,(e1+e2)/2+4,'#f2c21b','right',11,700);T(c,'níveis',ex,e1+16,'#8fa8c4','center',10);
  // estados

  else if(est==='emite'){ta+=dt;const q=Math.min(1,ta/.6);rr=r2+(r1-r2)*q;eletronY=e2+(e1-e2)*q;
   const tx=W*.74,ty=H*.3;onda(c,ax+r2,ay,ax+r2+(tx-ax-r2)*Math.min(1,ta/.6),ay+(ty-ay)*Math.min(1,ta/.6),Math.max(6,s.lam/50),cor,4);
   if(ta>=.6){est='estoura';ta=0;for(let i=0;i<70;i++){const a=Math.random()*6.283,v=60+Math.random()*120;part.push({x:tx,y:ty,vx:Math.cos(a)*v,vy:Math.sin(a)*v,a:1,cor})}
    const ok=fog.s===ped[idx];if(ok){feitos.push(fog.s);idx++;dizer(idx<5?`Isso! O ${s.n.toLowerCase()} emitiu ${s.cor}: fótons de ${fmt(s.E,1)} eV. Próximo pedido!`:'Show completo! Cada cor veio de elétrons voltando para o nível de menor energia.',[])}
    else{erros++;dizer(`Ops! O pedido era ${SAIS[ped[idx]].cor}, mas o ${s.n.toLowerCase()} emite ${s.cor}. Cada elemento tem sua cor: escolha outro sal.`,[])}
    pinta();if(idx>=5&&!feito){feito=true;A.concluir({erros})}}}
  else if(est==='estoura'){ta+=dt;rr=r1;if(ta>1.4){est='pronto'}}
  const ang=t*2.2;c.fillStyle='#e9fbff';brilho(c,ax+Math.cos(ang)*rr,ay+Math.sin(ang)*rr,10,'rgba(63,224,255,.8)');c.beginPath();c.arc(ax+Math.cos(ang)*rr,ay+Math.sin(ang)*rr,4,0,7);c.fill();

  if(est==='emite')T(c,W<600?'o elétron volta: fóton!':'o elétron volta e emite um fóton',ax,50,cor,'center',11,700);

  // fila de pedidos
  ped.forEach((k,i)=>{const x=W*.52+i*26,y=22;c.fillStyle=corLam(SAIS[k].lam);c.globalAlpha=i<idx?.35:1;c.beginPath();c.arc(x,y,9,0,7);c.fill();c.globalAlpha=1;if(i<idx)T(c,'✔',x,y+5,'#022','center',12,700);if(i===idx){c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(x,y,12,0,7);c.stroke()}})})}
