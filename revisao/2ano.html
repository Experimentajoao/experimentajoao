<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão do Ano · Física 2º ano | Experimenta João</title>
<meta name="description" content="Revisão de Física do 2º ano em modo apresentação: termologia, termodinâmica, óptica, ondas e som, com simuladores e exercícios.">
<meta name="theme-color" content="#1f4d3f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Kalam:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<script src="motor.js"></script>
<script>
(function () {
  function seta(R, pai, cor, larg) {
    var gr = R.sv("g", null, pai);
    var l = R.sv("line", { stroke: cor, "stroke-width": larg || 4, "stroke-linecap": "round" }, gr);
    var p = R.sv("polygon", { fill: cor }, gr);
    return function (x1, y1, x2, y2, tracejado) {
      var len = Math.hypot(x2 - x1, y2 - y1);
      gr.style.display = len < 3 ? "none" : "";
      if (len < 3) return;
      var ux = (x2 - x1) / len, uy = (y2 - y1) / len;
      l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2 - ux * 6); l.setAttribute("y2", y2 - uy * 6);
      l.setAttribute("stroke-dasharray", tracejado ? "8 6" : "none");
      p.setAttribute("points", [x2, y2, x2 - ux * 13 - uy * 7, y2 - uy * 13 + ux * 7, x2 - ux * 13 + uy * 7, y2 - uy * 13 - ux * 7].join(","));
    };
  }
  function termometro(R, svg, x, y, alt, cor) {
    R.sv("rect", { x: x - 9, y: y, width: 18, height: alt, rx: 9, fill: "#fff", stroke: "#1f2328", "stroke-width": 3 }, svg);
    R.sv("circle", { cx: x, cy: y + alt + 8, r: 16, fill: cor, stroke: "#1f2328", "stroke-width": 3 }, svg);
    var col = R.sv("rect", { x: x - 5, width: 10, fill: cor }, svg);
    return function (frac) { frac = Math.max(0, Math.min(1, frac)); var h = (alt - 6) * frac + 6; col.setAttribute("y", y + alt - h + 4); col.setAttribute("height", h); };
  }

  Revisao.iniciar({
    serie: "2º ano",
    titulo: "Revisão do Ano · Física 2º ano",
    subtitulo: "Calor, luz, ondas e som",
    cor: "#6b2fa3", corClara: "#f1e6fb",
    apresentacao: "Tudo o que a turma estudou no ano, em oito paradas: do termômetro até a sirene da ambulância.",
    slides: [
      {
        tema: "Termometria", icone: "🌡️", titulo: "Escalas de temperatura",
        ideia: "<p>Temperatura mede o <strong>grau de agitação das partículas</strong>. Três escalas são usadas: Celsius, Fahrenheit e Kelvin.</p><p>O Kelvin é a escala absoluta: o <strong>zero absoluto (0 K = −273 °C)</strong> é o ponto em que a agitação seria mínima. Não existe temperatura negativa em Kelvin.</p>",
        formula: 'C / 5 = (F − 32) / 9 = (K − 273) / 5<br><span class="giz">K = C + 273</span><small>água congela: 0 °C = 32 °F = 273 K · ferve: 100 °C = 212 °F = 373 K</small>',
        pergunta: { p: "Existe uma temperatura em que Celsius e Fahrenheit marcam o mesmo número?", r: "Sim: −40 °C = −40 °F. Use o botão −40 no simulador e mostre os dois termômetros iguais." },
        simTitulo: "Três termômetros",
        sim: function (box, R) {
          var svg = R.palco(600, 300, "Três termômetros nas escalas Celsius, Fahrenheit e Kelvin");
          R.sv("rect", { x: 0, y: 0, width: 600, height: 300, fill: "#f6fbff" }, svg);
          var esc = [{ n: "Celsius", x: 130, cor: "#e85d3a", u: "°C" }, { n: "Fahrenheit", x: 300, cor: "#6b2fa3", u: "°F" }, { n: "Kelvin", x: 470, cor: "#1d4ed8", u: "K" }];
          esc.forEach(function (e) {
            e.set = termometro(R, svg, e.x, 40, 190, e.cor);
            R.sv("text", { x: e.x, y: 28, "text-anchor": "middle", "font-weight": 900, "font-size": 15 }, svg).textContent = e.n;
            e.t = R.sv("text", { x: e.x + 24, "font-weight": 900, "font-size": 18, fill: e.cor }, svg);
          });
          var ctr = R.controles();
          var C = R.slider(ctr, "Temperatura", -50, 150, 1, 25, function (v) { return v + " °C"; }, desenha);
          var pres = R.el("div", { class: "opcoes", style: "margin-top:.5rem" }, box);
          [[-40, "−40 (iguais!)"], [0, "🧊 0 gelo"], [36.5, "🤒 36,5 corpo"], [100, "♨️ 100 fervura"]].forEach(function (p) {
            R.botao(pres, p[1], function () { C.set(p[0]); desenha(); });
          });
          var L = R.leituras();
          function desenha() {
            var c = C.v, f = c * 9 / 5 + 32, k = c + 273;
            var frac = (c + 50) / 200;
            [c, f, k].forEach(function (v, i) {
              esc[i].set(frac);
              esc[i].t.setAttribute("y", 40 + 190 - 190 * frac + 10);
              esc[i].t.textContent = R.fmt(v, 1) + " " + esc[i].u;
            });
            L.set("c", "Celsius", R.fmt(c, 1) + " °C"); L.set("f", "Fahrenheit", R.fmt(f, 1) + " °F"); L.set("k", "Kelvin", R.fmt(k, 1) + " K");
          }
          desenha();
        },
        exercicios: [
          { p: "Um dia de 25 °C corresponde a quantos kelvin?", ops: ["25 K", "248 K", "298 K", "77 K"], c: 2, exp: "K = C + 273 = 25 + 273 = 298 K." },
          { p: "Um termômetro americano marca 212 °F. Isso equivale a:", ops: ["100 °C", "212 °C", "180 °C", "0 °C"], c: 0, exp: "C/5 = (212 − 32)/9 = 20 → C = 100 °C, a fervura da água ao nível do mar." }
        ]
      },
      {
        tema: "Calorimetria", icone: "🔥", titulo: "Calor sensível e calor latente",
        ideia: "<p><strong>Calor</strong> é energia que passa do corpo mais quente para o mais frio.</p><p>Quando o corpo recebe calor e a temperatura sobe, é <strong>calor sensível</strong>. Cada material tem seu <strong>calor específico</strong>: a água esquenta devagar, o metal esquenta rápido.</p><p>Quando a temperatura para de subir e o material muda de estado (ferve, derrete), é <strong>calor latente</strong>.</p>",
        formula: 'Q = m · c · ΔT<br><span class="giz">Q = m · L</span><small>c da água = 1 cal/g·°C · L de vaporização da água = 540 cal/g</small>',
        pergunta: { p: "Por que a areia da praia queima o pé ao meio-dia, mas a água do mar continua fresca?", r: "A água tem calor específico muito maior que a areia: recebendo o mesmo calor do Sol, a temperatura dela sobe bem menos." },
        simTitulo: "Aquecendo no fogo",
        sim: function (box, R) {
          var svg = R.palco(600, 300, "Recipiente sobre a chama com termômetro");
          R.sv("rect", { x: 0, y: 0, width: 600, height: 300, fill: "#f6fbff" }, svg);
          R.sv("rect", { x: 150, y: 250, width: 200, height: 14, fill: "#4a4f57" }, svg);
          var chamas = R.sv("g", null, svg);
          for (var i = 0; i < 5; i++) R.sv("path", { d: "M" + (180 + i * 35) + ",250 q10,-30 0,-45 q-10,20 -10,30 z", fill: "#f7a21e" }, chamas);
          var corpo = R.sv("rect", { x: 170, y: 130, width: 160, height: 110, rx: 8, stroke: "#1f2328", "stroke-width": 4 }, svg);
          var bolhas = R.sv("g", null, svg);
          var nomeM = R.sv("text", { x: 250, y: 190, "text-anchor": "middle", "font-weight": 900, "font-size": 17, fill: "#1f2328" }, svg);
          var setT = termometro(R, svg, 430, 50, 190, "#e85d3a");
          var tT = R.sv("text", { x: 455, y: 150, "font-weight": 900, "font-size": 18, fill: "#e85d3a" }, svg);
          var ctr = R.controles();
          var mat = R.opcoes(ctr, "Material", [{ v: "agua", t: "💧 Água" }, { v: "al", t: "Alumínio" }, { v: "fe", t: "Ferro" }], "agua", desenha);
          var m = R.slider(ctr, "Massa", 50, 1000, 50, 200, function (v) { return v + " g"; }, desenha);
          var Q = R.slider(ctr, "Calor fornecido (Q)", 0, 40000, 500, 4000, function (v) { return R.fmt(v, 0) + " cal"; }, desenha);
          var L = R.leituras(); var av = R.aviso();
          var D = { agua: { c: 1, n: "Água", cor: "#9fd3ff" }, al: { c: 0.22, n: "Alumínio", cor: "#c9d1da" }, fe: { c: 0.11, n: "Ferro", cor: "#8a8f98" } };
          var ferve = false, t = 0;
          function desenha() {
            var d = D[mat.v], T0 = 20;
            var dT = Q.v / (m.v * d.c), Tf = T0 + dT, sobra = 0;
            ferve = false;
            if (mat.v === "agua" && Tf > 100) { sobra = Q.v - m.v * d.c * 80; Tf = 100; ferve = true; }
            corpo.setAttribute("fill", d.cor); nomeM.textContent = d.n + " · " + m.v + " g";
            chamas.style.opacity = 0.25 + 0.75 * Q.v / 40000;
            var tmax = 400;
            setT(Math.min(Tf, tmax) / tmax); tT.textContent = R.fmt(Tf, 1) + " °C";
            L.set("c", "Calor específico", R.fmt(d.c, 2) + " cal/g·°C");
            L.set("dt", "Variação ΔT", R.fmt(Tf - T0, 1) + " °C");
            L.set("tf", "Temperatura final", R.fmt(Tf, 1) + " °C");
            if (ferve) {
              var vap = Math.min(m.v, sobra / 540);
              av.set("A água chegou a 100 °C e está fervendo. O calor que sobra (" + R.fmt(sobra, 0) + " cal) vira calor latente: vaporiza cerca de " + R.fmt(vap, 0) + " g de água, e a temperatura não sobe mais.", "alerta");
            } else if ((mat.v === "al" && Tf > 660) || (mat.v === "fe" && Tf > 1538)) {
              av.set("Com tanto calor o " + d.n.toLowerCase() + " já teria derretido (alumínio funde a 660 °C, ferro a 1538 °C). Aí entra o calor latente de fusão.", "alerta");
            } else av.set("Começou a 20 °C. ΔT = Q ÷ (m · c) = " + R.fmt(Q.v, 0) + " ÷ (" + m.v + " · " + R.fmt(d.c, 2) + ") = " + R.fmt(Tf - T0, 1) + " °C.");
            bolhas.innerHTML = "";
          }
          R.animar(function (dt) {
            if (!ferve) return;
            t += dt;
            if (Math.random() < 0.3) { var b = R.sv("circle", { cx: 185 + Math.random() * 130, cy: 235, r: 3 + Math.random() * 4, fill: "#fff", opacity: .8 }, bolhas); b._v = 40 + Math.random() * 40; }
            Array.prototype.slice.call(bolhas.children).forEach(function (b) { var y = +b.getAttribute("cy") - b._v * dt; if (y < 135) b.remove(); else b.setAttribute("cy", y); });
          });
          desenha();
        },
        exercicios: [
          { p: "Quanto calor é preciso para aquecer 200 g de água de 20 °C até 40 °C? (c = 1 cal/g·°C)", ops: ["20 cal", "200 cal", "4 000 cal", "8 000 cal"], c: 2, exp: "Q = m · c · ΔT = 200 · 1 · 20 = 4 000 cal." },
          { p: "Durante a fervura da água, a temperatura fica em 100 °C mesmo com o fogo aceso porque:", ops: ["o fogo perde força", "o calor está sendo usado para mudar de estado (calor latente)", "a água perde massa", "o termômetro trava"], c: 1, exp: "Na mudança de estado o calor rompe as ligações entre as moléculas em vez de aumentar a agitação. Teste no simulador com muito calor." }
        ]
      },
      {
        tema: "Dilatação", icone: "🌉", titulo: "Dilatação térmica",
        ideia: "<p>Ao esquentar, as partículas vibram mais e se afastam: o corpo <strong>aumenta de tamanho</strong>.</p><p>O aumento depende do <strong>material</strong> (coeficiente α), do <strong>tamanho inicial</strong> e da <strong>variação de temperatura</strong>. Por isso pontes e trilhos têm juntas de dilatação.</p>",
        formula: 'ΔL = L<sub>0</sub> · α · ΔT<small>α do aço = 12 × 10⁻⁶ °C⁻¹ · ΔL e L₀ na mesma unidade</small>',
        pergunta: { p: "Por que é mais fácil abrir um pote de vidro com tampa de metal depois de passar água quente na tampa?", r: "O metal tem coeficiente de dilatação maior que o vidro: a tampa dilata mais e afrouxa." },
        simTitulo: "Barra de ponte",
        sim: function (box, R) {
          var svg = R.palco(600, 230, "Barra que aumenta de tamanho ao ser aquecida, com junta de dilatação");
          R.sv("rect", { x: 0, y: 0, width: 600, height: 230, fill: "#f6fbff" }, svg);
          R.sv("rect", { x: 20, y: 120, width: 30, height: 90, fill: "#9aa5b1", stroke: "#1f2328", "stroke-width": 3 }, svg);
          R.sv("rect", { x: 540, y: 120, width: 40, height: 90, fill: "#9aa5b1", stroke: "#1f2328", "stroke-width": 3 }, svg);
          var barra = R.sv("rect", { x: 50, y: 90, height: 30, stroke: "#1f2328", "stroke-width": 3 }, svg);
          var orig = R.sv("line", { y1: 70, y2: 135, stroke: "#1d4ed8", "stroke-width": 2, "stroke-dasharray": "5 4" }, svg);
          R.sv("text", { x: 300, y: 30, "text-anchor": "middle", "font-size": 13, "font-weight": 800, fill: "#4a4f57" }, svg).textContent = "Desenho com a dilatação aumentada para dar para ver";
          var tGap = R.sv("text", { x: 520, y: 60, "text-anchor": "middle", "font-size": 13, "font-weight": 900 }, svg);
          var ctr = R.controles();
          var mat = R.opcoes(ctr, "Material", [{ v: 12e-6, t: "Aço" }, { v: 17e-6, t: "Cobre" }, { v: 23e-6, t: "Alumínio" }, { v: 9e-6, t: "Vidro" }], 12e-6, desenha);
          var L0 = R.slider(ctr, "Comprimento inicial", 1, 100, 1, 10, function (v) { return v + " m"; }, desenha);
          var dT = R.slider(ctr, "Aquecimento ΔT", 0, 100, 5, 50, function (v) { return v + " °C"; }, desenha);
          var L = R.leituras(); var av = R.aviso();
          function desenha() {
            var dL = L0.v * mat.v * dT.v; // m
            var base = 440, extra = Math.min(48, dL * 1000 * 1.5);
            barra.setAttribute("width", base + extra);
            var heat = dT.v / 100;
            barra.setAttribute("fill", "rgb(" + Math.round(150 + 105 * heat) + "," + Math.round(160 - 60 * heat) + "," + Math.round(175 - 120 * heat) + ")");
            orig.setAttribute("x1", 50 + base); orig.setAttribute("x2", 50 + base);
            var folga = 50 - extra;
            tGap.textContent = folga > 2 ? "junta: sobra espaço" : "encostou!";
            L.set("dl", "Dilatação ΔL", R.fmt(dL * 1000, 2) + " mm");
            L.set("lf", "Comprimento final", R.fmt(L0.v + dL, 5) + " m");
            L.set("a", "Coeficiente α", R.fmt(mat.v * 1e6, 0) + " × 10⁻⁶ /°C");
            av.set("ΔL = " + L0.v + " · " + R.fmt(mat.v * 1e6, 0) + "×10⁻⁶ · " + dT.v + " = " + R.fmt(dL * 1000, 2) + " mm", folga > 2 ? "" : "alerta");
          }
          desenha();
        },
        exercicios: [
          { p: "Um trilho de aço de 10 m é aquecido em 50 °C. Quanto ele dilata? (α = 12 × 10⁻⁶ °C⁻¹)", ops: ["0,6 mm", "6 mm", "60 mm", "600 mm"], c: 1, exp: "ΔL = 10 · 12×10⁻⁶ · 50 = 0,006 m = 6 mm." },
          { p: "Duas barras iguais, uma de alumínio e outra de aço, são aquecidas igualmente. Qual dilata mais?", ops: ["A de aço", "A de alumínio, que tem α maior", "As duas dilatam igual", "Nenhuma dilata"], c: 1, exp: "O alumínio tem α ≈ 23×10⁻⁶ /°C, quase o dobro do aço." }
        ]
      },
      {
        tema: "Termodinâmica", icone: "⚙️", titulo: "1ª e 2ª leis da termodinâmica",
        ideia: "<p><strong>1ª lei:</strong> o calor que o gás recebe vira trabalho (o gás empurra o êmbolo) e aumento de energia interna (o gás esquenta). É a conservação da energia.</p><p><strong>2ª lei:</strong> o calor flui sozinho do quente para o frio, e nenhuma máquina térmica transforma 100% do calor em trabalho.</p>",
        formula: 'Q = τ + ΔU<br><span class="giz">η = τ / Q<sub>quente</sub> &lt; 100%</span><small>Q &gt; 0: gás recebe calor · τ &gt; 0: gás se expande · ΔU &gt; 0: gás esquenta</small>',
        pergunta: { p: "Se um gás recebe 500 J de calor e não consegue se expandir (êmbolo travado), para onde vai a energia?", r: "Toda para a energia interna: τ = 0, então ΔU = Q = 500 J e o gás esquenta. Coloque τ = 0 no simulador." },
        simTitulo: "Gás no cilindro",
        sim: function (box, R) {
          var svg = R.palco(600, 280, "Cilindro com gás e êmbolo móvel");
          R.sv("rect", { x: 0, y: 0, width: 600, height: 280, fill: "#f6fbff" }, svg);
          var gas = R.sv("rect", { x: 160, width: 200, fill: "#ffd9c7" }, svg);
          R.sv("path", { d: "M160,40 L160,250 L360,250 L360,40", fill: "none", stroke: "#1f2328", "stroke-width": 5 }, svg);
          var emb = R.sv("rect", { x: 162, width: 196, height: 16, fill: "#4a4f57" }, svg);
          var haste = R.sv("rect", { x: 254, y: 0, width: 12, fill: "#4a4f57" }, svg);
          var partes = R.sv("g", null, svg), ps = [];
          for (var i = 0; i < 26; i++) ps.push({ el: R.sv("circle", { r: 5, fill: "#e85d3a" }, partes), x: 170 + Math.random() * 180, y: 150 + Math.random() * 90, a: Math.random() * 6.28 });
          var chama = R.sv("g", null, svg);
          for (var k = 0; k < 4; k++) R.sv("path", { d: "M" + (195 + k * 45) + ",275 q10,-26 0,-38 q-10,18 -10,26 z", fill: "#f7a21e" }, chama);
          var sQ = seta(R, svg, "#e85d3a", 5), sT = seta(R, svg, "#1d4ed8", 5);
          var tQ = R.sv("text", { x: 440, y: 230, "font-weight": 900, "font-size": 15, fill: "#e85d3a" }, svg);
          var tT = R.sv("text", { x: 440, y: 60, "font-weight": 900, "font-size": 15, fill: "#1d4ed8" }, svg);
          var ctr = R.controles();
          var Q = R.slider(ctr, "Calor recebido (Q)", -600, 1000, 50, 500, function (v) { return v + " J"; }, desenha);
          var T = R.slider(ctr, "Trabalho do gás (τ)", -600, 1000, 50, 200, function (v) { return v + " J"; }, desenha);
          var L = R.leituras(); var av = R.aviso();
          var yEmb, vel;
          function desenha() {
            var dU = Q.v - T.v;
            yEmb = 130 - T.v * 0.07;
            gas.setAttribute("y", yEmb + 16); gas.setAttribute("height", 250 - yEmb - 16);
            emb.setAttribute("y", yEmb); haste.setAttribute("height", yEmb);
            var temp = Math.max(-1, Math.min(1, dU / 800));
            gas.setAttribute("fill", temp >= 0 ? "rgb(255," + Math.round(217 - 110 * temp) + "," + Math.round(199 - 150 * temp) + ")" : "rgb(" + Math.round(255 + 120 * temp) + "," + Math.round(217 + 20 * temp) + ",255)");
            vel = 60 * (1 + temp * 0.9);
            chama.style.opacity = Q.v > 0 ? 0.3 + 0.7 * Q.v / 1000 : 0;
            if (Q.v >= 0) sQ(420, 250, 370, 200); else sQ(370, 200, 420, 250);
            tQ.textContent = Q.v >= 0 ? "recebe " + Q.v + " J" : "cede " + (-Q.v) + " J";
            if (T.v >= 0) sT(300, yEmb - 10, 300, yEmb - 10 - Math.min(60, T.v * 0.06 + 10)); else sT(300, yEmb - 70, 300, yEmb - 12);
            tT.textContent = T.v > 0 ? "gás se expande" : T.v < 0 ? "gás é comprimido" : "êmbolo parado";
            L.set("q", "Calor Q", Q.v + " J"); L.set("t", "Trabalho τ", T.v + " J"); L.set("u", "Energia interna ΔU = Q − τ", dU + " J");
            av.set(dU > 0 ? "ΔU positivo: o gás esquenta (partículas mais rápidas)." : dU < 0 ? "ΔU negativo: o gás esfria (partículas mais lentas)." : "ΔU = 0: temperatura constante (transformação isotérmica).", dU === 0 ? "neutro" : dU > 0 ? "alerta" : "");
          }
          R.animar(function (dt) {
            ps.forEach(function (p) {
              p.x += Math.cos(p.a) * vel * dt; p.y += Math.sin(p.a) * vel * dt;
              if (p.x < 168 || p.x > 352) { p.a = Math.PI - p.a; p.x = Math.max(168, Math.min(352, p.x)); }
              if (p.y < yEmb + 24 || p.y > 243) { p.a = -p.a; p.y = Math.max(yEmb + 24, Math.min(243, p.y)); }
              p.el.setAttribute("cx", p.x); p.el.setAttribute("cy", p.y);
            });
          });
          desenha();
        },
        exercicios: [
          { p: "Um gás recebe 500 J de calor e realiza 200 J de trabalho. A variação da energia interna é:", ops: ["700 J", "300 J", "−300 J", "2,5 J"], c: 1, exp: "ΔU = Q − τ = 500 − 200 = 300 J. O gás esquenta." },
          { p: "Segundo a 2ª lei da termodinâmica, uma máquina térmica:", ops: ["pode ter rendimento de 100%", "sempre rejeita parte do calor para a fonte fria", "cria energia", "funciona sem fonte quente"], c: 1, exp: "Nenhuma máquina térmica transforma todo o calor em trabalho: parte sempre vai para a fonte fria." }
        ]
      },
      {
        tema: "Óptica", icone: "🔦", titulo: "Reflexão e refração",

      { tema: "Calorimetria", p: "Dois blocos de mesma massa, um de ferro e outro de alumínio, recebem o mesmo calor. Qual esquenta mais?", ops: ["O de alumínio", "O de ferro, que tem menor calor específico", "Os dois igualmente", "Nenhum"], c: 1, exp: "ΔT = Q/(m·c): com c menor (ferro, 0,11), a variação de temperatura é maior." },
      { tema: "Calorimetria", p: "Em um dia frio, a maçaneta de metal parece mais fria que a porta de madeira, mesmo estando à mesma temperatura. Isso porque:", ops: ["o metal está mais frio", "o metal conduz calor melhor e tira calor da mão mais rápido", "a madeira produz calor", "o metal tem menos massa"], c: 1, exp: "As duas estão na mesma temperatura; o metal é bom condutor e retira calor da mão mais rapidamente." },
      { tema: "Propagação do calor", p: "O aquecimento da água em uma panela, com a água quente subindo e a fria descendo, é um exemplo de:", ops: ["condução", "convecção", "irradiação", "dilatação"], c: 1, exp: "Convecção: correntes de fluido mais quente (menos denso) sobem e as mais frias descem." },
      { tema: "Dilatação", p: "Fios de alta tensão ficam mais esticados no inverno e mais curvados no verão porque:", ops: ["no verão eles dilatam", "no inverno eles dilatam", "o vento estica os fios", "a corrente muda"], c: 0, exp: "No calor o metal dilata, o fio fica mais comprido e curva mais." },
      { tema: "Termodinâmica", p: "Em uma transformação isotérmica de um gás ideal, a variação da energia interna é:", ops: ["máxima", "zero", "igual ao calor", "negativa"], c: 1, exp: "A energia interna do gás ideal depende só da temperatura: temperatura constante, ΔU = 0 e Q = τ." },
      { tema: "Óptica", p: "A imagem de uma pessoa em um espelho plano é:", ops: ["real e invertida", "virtual, direita e do mesmo tamanho", "virtual e maior", "real e menor"], c: 1, exp: "Espelho plano: imagem virtual, direita, do mesmo tamanho e simétrica em relação ao espelho." },
      { tema: "Óptica da visão", p: "Na hipermetropia, a imagem se forma depois da retina. A lente corretora é:", ops: ["divergente", "convergente", "plana", "cilíndrica"], c: 1, exp: "A lente convergente antecipa a convergência dos raios para que a imagem se forme na retina." },
      { tema: "Ondas", p: "Ondas de rádio, luz e raios X têm em comum:", ops: ["a mesma frequência", "são ondas eletromagnéticas e viajam a 300 000 km/s no vácuo", "precisam de um meio material", "são ondas sonoras"], c: 1, exp: "Todas são ondas eletromagnéticas; no vácuo, todas viajam com a velocidade da luz." },
      { tema: "Acústica", p: "Duas pessoas cantam a mesma nota com o mesmo volume, mas dá para saber quem é quem. A qualidade que diferencia as vozes é:", ops: ["a altura", "a intensidade", "o timbre", "a frequência fundamental"], c: 2, exp: "O timbre depende da forma da onda (harmônicos) e diferencia fontes na mesma nota e volume." }
    ]
  });
})();
