<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="description" content="Revisão de Física do 3º ano em modo apresentação: eletrostática, circuitos, consumo de energia, eletromagnetismo e física moderna, com simuladores e exercícios.">
<meta name="theme-color" content="#1f4d3f">

</head>
<body>
<script src="motor.js"></script>
<script>
(function () {
  function seta(R, pai, cor, larg) {
    var gr = R.sv("g", null, pai);
    var l = R.sv("line", { stroke: cor, "stroke-width": larg || 5, "stroke-linecap": "round" }, gr);
    var p = R.sv("polygon", { fill: cor }, gr);
    return function (x1, y1, x2, y2) {
      var len = Math.hypot(x2 - x1, y2 - y1);
      gr.style.display = len < 3 ? "none" : "";
      if (len < 3) return;
      var ux = (x2 - x1) / len, uy = (y2 - y1) / len;
      l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2 - ux * 6); l.setAttribute("y2", y2 - uy * 6);
      p.setAttribute("points", [x2, y2, x2 - ux * 14 - uy * 8, y2 - uy * 14 + ux * 8, x2 - ux * 14 + uy * 8, y2 - uy * 14 - ux * 8].join(","));
    };
  }
  // percurso retangular para os elétrons de um circuito
  function noLaco(s, x0, y0, w, h) {
    var per = 2 * (w + h); s = ((s % per) + per) % per;
    if (s < w) return [x0 + s, y0];
    if (s < w + h) return [x0 + w, y0 + s - w];
    if (s < 2 * w + h) return [x0 + w - (s - w - h), y0 + h];
    return [x0, y0 + h - (s - 2 * w - h)];
  }
  function corDoComprimento(nm) {
    var r = 0, g = 0, b = 0;
    if (nm >= 380 && nm < 440) { r = -(nm - 440) / 60; b = 1; }
    else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
    else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
    else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
    else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
    else if (nm <= 750) { r = 1; }
    return "rgb(" + Math.round(255 * r) + "," + Math.round(255 * g) + "," + Math.round(255 * b) + ")";
  }

  Revisao.iniciar({
    serie: "3º ano",
    titulo: "Revisão do Ano · Física 3º ano",
    subtitulo: "Eletricidade, magnetismo e física moderna",
    cor: "#0f6e5c", corClara: "#dcf2ec",
    apresentacao: "Tudo o que a turma estudou no ano, em oito paradas: da carga elétrica até o fóton que arranca elétrons do metal.",
    slides: [
      {
        tema: "Eletrostática", icone: "⚡", titulo: "Cargas elétricas e Lei de Coulomb",
        ideia: "<p>Cargas de <strong>sinais iguais se repelem</strong> e de <strong>sinais opostos se atraem</strong>.</p><p>A força cresce com o valor das cargas e <strong>diminui com o quadrado da distância</strong>: dobrando a distância, a força cai para um quarto.</p>",
        formula: 'F = k · |q<sub>1</sub> · q<sub>2</sub>| / d²<small>k = 9 × 10⁹ N·m²/C² · cargas em coulombs (μC = 10⁻⁶ C) · d em metros</small>',
        pergunta: { p: "Se a distância entre duas cargas cair pela metade, a força dobra?", r: "Não, fica 4 vezes maior, porque a distância está ao quadrado no denominador. Mostre no simulador indo de 0,6 m para 0,3 m." },
        simTitulo: "Duas cargas",
        sim: function (box, R) {
          var svg = R.palco(600, 220, "Duas cargas elétricas com as setas de força entre elas");
          R.sv("rect", { x: 0, y: 0, width: 600, height: 220, fill: "#f6fbff" }, svg);
          R.sv("line", { x1: 20, y1: 110, x2: 580, y2: 110, stroke: "#dbe3ec", "stroke-width": 2 }, svg);
          function bola() { var gr = R.sv("g", null, svg); var c = R.sv("circle", { r: 26, stroke: "#1f2328", "stroke-width": 3 }, gr); var t = R.sv("text", { y: 9, "text-anchor": "middle", "font-size": 26, "font-weight": 900, fill: "#fff" }, gr); var v = R.sv("text", { y: 52, "text-anchor": "middle", "font-size": 13, "font-weight": 800, fill: "#1f2328" }, gr); return { g: gr, c: c, t: t, v: v }; }
          var A = bola(), B = bola();
          var s1 = seta(R, svg, "#0f6e5c"), s2 = seta(R, svg, "#0f6e5c");
          var cota = R.sv("text", { y: 200, "text-anchor": "middle", "font-size": 14, "font-weight": 900, fill: "#4a4f57" }, svg);
          var ctr = R.controles();
          var q1 = R.slider(ctr, "Carga 1 (q₁)", -5, 5, 1, 2, function (v) { return (v > 0 ? "+" : "") + v + " μC"; }, desenha);
          var q2 = R.slider(ctr, "Carga 2 (q₂)", -5, 5, 1, -3, function (v) { return (v > 0 ? "+" : "") + v + " μC"; }, desenha);
          var d = R.slider(ctr, "Distância (d)", 0.1, 1, 0.05, 0.3, function (v) { return R.fmt(v, 2) + " m"; }, desenha);
          var L = R.leituras(); var av = R.aviso();
          function pint(b, q) { b.c.setAttribute("fill", q > 0 ? "#e85d3a" : q < 0 ? "#1d4ed8" : "#9aa5b1"); b.t.textContent = q > 0 ? "+" : q < 0 ? "−" : "0"; b.v.textContent = (q > 0 ? "+" : "") + q + " μC"; }
          function desenha() {
            var dx = d.v * 420, xa = 300 - dx / 2, xb = 300 + dx / 2;
            A.g.setAttribute("transform", "translate(" + xa + ",110)"); B.g.setAttribute("transform", "translate(" + xb + ",110)");
            pint(A, q1.v); pint(B, q2.v);
            cota.setAttribute("x", 300); cota.textContent = "d = " + R.fmt(d.v, 2) + " m";
            var F = 9e9 * Math.abs(q1.v * q2.v) * 1e-12 / (d.v * d.v);
            var len = Math.min(140, 14 + 50 * Math.sqrt(F));
            var sinal = q1.v * q2.v;
            if (sinal === 0) { s1(0, 0, 0, 0); s2(0, 0, 0, 0); }
            else if (sinal > 0) { s1(xa - 28, 70, xa - 28 - len, 70); s2(xb + 28, 70, xb + 28 + len, 70); }
            else { var l2 = Math.min(len, dx / 2 - 30); s1(xa + 28, 70, xa + 28 + Math.max(8, l2), 70); s2(xb - 28, 70, xb - 28 - Math.max(8, l2), 70); }
            L.set("f", "Força elétrica", R.fmt(F, 3) + " N");
            L.set("r", "Comparando com d = 1 m", R.fmt(1 / (d.v * d.v), 1) + " vezes maior");
            av.set(sinal === 0 ? "Uma carga é zero: não há força elétrica." : sinal > 0 ? "Sinais iguais: as cargas se repelem." : "Sinais opostos: as cargas se atraem.", sinal < 0 ? "" : "neutro");
          }
          desenha();
        },
        exercicios: [
          { p: "Duas cargas se atraem com força F. Se a distância entre elas dobrar, a nova força será:", ops: ["2F", "F/2", "F/4", "4F"], c: 2, exp: "F ∝ 1/d²: com 2d, a força fica 1/2² = 1/4 da original." },
          { p: "Um bastão de vidro atritado com lã fica positivo porque:", ops: ["ganhou prótons da lã", "perdeu elétrons para a lã", "ganhou elétrons", "criou cargas positivas"], c: 1, exp: "Na eletrização só os elétrons se movem: o vidro perdeu elétrons e ficou com falta deles (positivo)." }
        ]
      },
      {
        tema: "Eletrodinâmica", icone: "💡", titulo: "Corrente elétrica e Lei de Ohm",
        ideia: "<p><strong>Corrente elétrica</strong> é o movimento ordenado de elétrons, empurrados pela <strong>tensão</strong> (ddp) da pilha ou da tomada.</p><p>O <strong>resistor</strong> dificulta a passagem: com a mesma tensão, mais resistência significa menos corrente. A <strong>potência</strong> diz quanta energia por segundo é usada.</p>",
        formula: 'U = R · i<br><span class="giz">P = U · i</span><small>U: tensão (V) · R: resistência (Ω) · i: corrente (A) · P: potência (W)</small>',
        pergunta: { p: "O que acontece com o brilho da lâmpada se a resistência do circuito aumenta e a tensão continua a mesma?", r: "A corrente diminui (i = U/R), a potência cai e a lâmpada brilha menos." },
        simTitulo: "Circuito com lâmpada",
        sim: function (box, R) {
          var svg = R.palco(600, 260, "Circuito com pilha, fios e lâmpada, com elétrons se movendo");
          R.sv("rect", { x: 0, y: 0, width: 600, height: 260, fill: "#f6fbff" }, svg);
          R.sv("rect", { x: 100, y: 50, width: 400, height: 160, fill: "none", stroke: "#c08a2e", "stroke-width": 8, rx: 10 }, svg);
          R.sv("rect", { x: 80, y: 95, width: 40, height: 70, fill: "#1f2328" }, svg);
          R.sv("rect", { x: 90, y: 85, width: 20, height: 10, fill: "#9aa5b1" }, svg);
          var tV = R.sv("text", { x: 60, y: 135, "text-anchor": "end", "font-weight": 900, "font-size": 15 }, svg);
          var brilho = R.sv("circle", { cx: 300, cy: 50, r: 60, fill: "#f7c51e" }, svg);
          R.sv("circle", { cx: 300, cy: 50, r: 22, fill: "#fff8d6", stroke: "#1f2328", "stroke-width": 3 }, svg);
          R.sv("path", { d: "M290,52 q5,-12 10,0 q5,-12 10,0", fill: "none", stroke: "#1f2328", "stroke-width": 2 }, svg);
          R.sv("rect", { x: 380, y: 196, width: 70, height: 28, fill: "#fff", stroke: "#1f2328", "stroke-width": 3 }, svg);
          var tR = R.sv("text", { x: 415, y: 216, "text-anchor": "middle", "font-weight": 900, "font-size": 13 }, svg);
          var eletrons = [], gE = R.sv("g", null, svg);
          for (var i = 0; i < 24; i++) eletrons.push({ s: i * 50, el: R.sv("circle", { r: 5, fill: "#1d4ed8" }, gE) });
          var ctr = R.controles();
          var U = R.slider(ctr, "Tensão da fonte (U)", 1.5, 24, 1.5, 12, function (v) { return R.fmt(v, 1) + " V"; }, desenha);
          var Rr = R.slider(ctr, "Resistência (R)", 1, 100, 1, 4, function (v) { return v + " Ω"; }, desenha);
          var L = R.leituras(); var av = R.aviso();
          var i0 = 0;
          function desenha() {
            i0 = U.v / Rr.v; var P = U.v * i0;
            tV.textContent = R.fmt(U.v, 1) + " V"; tR.textContent = Rr.v + " Ω";
            brilho.setAttribute("opacity", Math.min(0.95, P / 60)); brilho.setAttribute("r", 26 + Math.min(50, P / 3));
            L.set("i", "Corrente i = U / R", R.fmt(i0, 2) + " A");
            L.set("p", "Potência P = U · i", R.fmt(P, 1) + " W");
            av.set(P > 100 ? "Corrente alta: em uma casa, um disjuntor desligaria para proteger os fios." : "Os elétrons (azul) andam mais rápido quando a corrente é maior.", P > 100 ? "alerta" : "neutro");
          }
          R.animar(function (dt) {
            eletrons.forEach(function (e) { e.s -= i0 * 25 * dt; var p = noLaco(e.s, 100, 50, 400, 160); e.el.setAttribute("cx", p[0]); e.el.setAttribute("cy", p[1]); });
          });
          desenha();
        },
        exercicios: [
          { p: "Uma lâmpada de resistência 4 Ω é ligada em 12 V. Qual a corrente?", ops: ["48 A", "3 A", "0,33 A", "16 A"], c: 1, exp: "i = U / R = 12 / 4 = 3 A." },
          { p: "Um chuveiro de 220 V puxa 25 A. Qual a potência dele?", ops: ["245 W", "8,8 W", "5 500 W", "195 W"], c: 2, exp: "P = U · i = 220 · 25 = 5 500 W." }
        ]
      },
      {
        tema: "Eletrodinâmica", icone: "🔌", titulo: "Associação de resistores",
        ideia: "<p>Em <strong>série</strong>, a corrente passa por um resistor depois do outro: as resistências <strong>somam</strong> e, se um queimar, tudo apaga (pisca-pisca antigo).</p><p>Em <strong>paralelo</strong>, cada resistor tem seu próprio caminho: a resistência total fica <strong>menor que a menor delas</strong>, e cada aparelho funciona independente (tomadas de casa).</p>",
        formula: 'Série: R<sub>eq</sub> = R<sub>1</sub> + R<sub>2</sub> + R<sub>3</sub><br><span class="giz">Paralelo: 1/R<sub>eq</sub> = 1/R<sub>1</sub> + 1/R<sub>2</sub> + 1/R<sub>3</sub></span><small>para dois em paralelo: R_eq = (R₁ · R₂) / (R₁ + R₂)</small>',
        pergunta: { p: "Por que as tomadas da sua casa são ligadas em paralelo e não em série?", r: "Em paralelo todas recebem a mesma tensão (127 ou 220 V) e um aparelho desligado não interrompe os outros." },
        simTitulo: "Série ou paralelo",
        sim: function (box, R) {
          var svg = R.palco(600, 250, "Três resistores ligados em série ou em paralelo");
          var tipoAtual = "s";
          var ctr = R.controles();
          var tipo = R.opcoes(ctr, "Ligação", [{ v: "s", t: "Em série" }, { v: "p", t: "Em paralelo" }], "s", function (v) { tipoAtual = v; desenha(); });
          var U = R.slider(ctr, "Tensão da fonte", 6, 24, 6, 12, function (v) { return v + " V"; }, desenha);
          var r1 = R.slider(ctr, "R₁", 1, 30, 1, 6, function (v) { return v + " Ω"; }, desenha);
          var r2 = R.slider(ctr, "R₂", 1, 30, 1, 3, function (v) { return v + " Ω"; }, desenha);
          var r3 = R.slider(ctr, "R₃", 1, 30, 1, 6, function (v) { return v + " Ω"; }, desenha);
          var L = R.leituras(); var av = R.aviso();
          function res(x, y, v, i, vert) {
            var w = vert ? 28 : 70, h = vert ? 60 : 28;
            R.sv("rect", { x: x - w / 2, y: y - h / 2, width: w, height: h, fill: "#fff", stroke: "#1f2328", "stroke-width": 3 }, svg);
            R.sv("text", { x: x + (vert ? 26 : 0), y: y + (vert ? 5 : -22), "text-anchor": vert ? "start" : "middle", "font-weight": 900, "font-size": 13 }, svg).textContent = v + " Ω";
            R.sv("text", { x: x + (vert ? 26 : 0), y: y + (vert ? 22 : 38), "text-anchor": vert ? "start" : "middle", "font-weight": 800, "font-size": 12, fill: "#0f6e5c" }, svg).textContent = R.fmt(i, 2) + " A";
          }
          function desenha() {
            svg.innerHTML = "";
            R.sv("rect", { x: 0, y: 0, width: 600, height: 250, fill: "#f6fbff" }, svg);
            var rs = [r1.v, r2.v, r3.v], Req, it, ic;
            R.sv("rect", { x: 30, y: 100, width: 30, height: 50, fill: "#1f2328" }, svg);
            R.sv("text", { x: 68, y: 130, "text-anchor": "start", "font-weight": 900, "font-size": 13 }, svg).textContent = U.v + " V";
            if (tipoAtual === "s") {
              Req = rs[0] + rs[1] + rs[2]; it = U.v / Req;
              R.sv("polyline", { points: "45,100 45,50 560,50 560,210 45,210 45,150", fill: "none", stroke: "#c08a2e", "stroke-width": 5 }, svg);
              [170, 300, 430].forEach(function (x, k) { res(x, 50, rs[k], it, false); });
              ic = [it, it, it];
            } else {
              Req = 1 / (1 / rs[0] + 1 / rs[1] + 1 / rs[2]); it = U.v / Req;
              R.sv("polyline", { points: "45,100 45,30 520,30 520,220 45,220 45,150", fill: "none", stroke: "#c08a2e", "stroke-width": 5 }, svg);
              ic = rs.map(function (r) { return U.v / r; });
              [200, 320, 440].forEach(function (x, k) {
                R.sv("line", { x1: x, y1: 30, x2: x, y2: 220, stroke: "#c08a2e", "stroke-width": 5 }, svg);
                res(x, 125, rs[k], ic[k], true);
              });
            }
            L.set("req", "Resistência equivalente", R.fmt(Req, 2) + " Ω");
            L.set("it", "Corrente total", R.fmt(it, 2) + " A");
            L.set("p", "Potência total", R.fmt(U.v * it, 1) + " W");
            av.set(tipoAtual === "s" ? "Em série a corrente é a mesma em todos e a tensão se divide." : "Em paralelo a tensão é a mesma em todos e a corrente se divide. R_eq (" + R.fmt(Req, 2) + " Ω) é menor que o menor resistor.", "neutro");
          }
          desenha();
        },
        exercicios: [
          { p: "Dois resistores de 6 Ω e 3 Ω são ligados em paralelo. A resistência equivalente é:", ops: ["9 Ω", "4,5 Ω", "2 Ω", "18 Ω"], c: 2, exp: "R_eq = (6 · 3) / (6 + 3) = 18 / 9 = 2 Ω." },
          { p: "Num pisca-pisca antigo, uma lâmpada queimou e todas apagaram. As lâmpadas estavam ligadas:", ops: ["em paralelo", "em série", "em curto-circuito", "sem fonte"], c: 1, exp: "Em série existe um caminho só: se uma lâmpada queima, o circuito abre e a corrente para em todas." }
        ]
      },
      {
        tema: "Energia elétrica", icone: "🧾", titulo: "Consumo e conta de luz",
        ideia: "<p>A conta de luz cobra a <strong>energia</strong> consumida, em <strong>quilowatt-hora (kWh)</strong>.</p><p>Energia é potência vezes tempo: um aparelho potente ligado por pouco tempo pode gastar menos que um fraco ligado o dia inteiro. O <strong>chuveiro elétrico</strong> costuma ser o campeão da conta.</p>",
        formula: 'E = P · Δt<br><span class="giz">E (kWh) = P (kW) × horas</span><small>1 kWh = 1000 W usados durante 1 hora · custo = kWh × tarifa</small>',
        pergunta: { p: "Diminuir 5 minutos no banho de cada pessoa da casa faz diferença na conta?", r: "Faz: um chuveiro de 5 500 W gasta cerca de 0,46 kWh a cada 5 minutos. Para 4 pessoas em 30 dias, são quase 55 kWh por mês. Teste no simulador." },
        simTitulo: "Calculadora da conta",
        sim: function (box, R) {
          var svg = R.palco(600, 200, "Medidor de energia e valor da conta");
          R.sv("rect", { x: 0, y: 0, width: 600, height: 200, fill: "#f6fbff" }, svg);
          R.sv("rect", { x: 40, y: 30, width: 220, height: 140, rx: 14, fill: "#fff", stroke: "#1f2328", "stroke-width": 4 }, svg);
          R.sv("text", { x: 150, y: 60, "text-anchor": "middle", "font-weight": 900, "font-size": 14, fill: "#4a4f57" }, svg).textContent = "MEDIDOR";
          var tK = R.sv("text", { x: 150, y: 115, "text-anchor": "middle", "font-weight": 900, "font-size": 34, fill: "#0f6e5c" }, svg);
          R.sv("text", { x: 150, y: 145, "text-anchor": "middle", "font-weight": 800, "font-size": 14 }, svg).textContent = "kWh por mês";
          var disco = R.sv("rect", { x: 70, y: 152, width: 160, height: 8, fill: "#9aa5b1" }, svg);
          var marca = R.sv("rect", { x: 70, y: 152, width: 16, height: 8, fill: "#b42318" }, svg);
          R.sv("rect", { x: 330, y: 50, width: 230, height: 100, rx: 10, fill: "#fff3c4", stroke: "#8a6a00", "stroke-width": 3, "stroke-dasharray": "8 5" }, svg);
          R.sv("text", { x: 445, y: 82, "text-anchor": "middle", "font-weight": 900, "font-size": 14 }, svg).textContent = "Na conta do mês";
          var tR = R.sv("text", { x: 445, y: 125, "text-anchor": "middle", "font-weight": 900, "font-size": 32, fill: "#b42318" }, svg);
          var ctr = R.controles();
          var ap = R.opcoes(ctr, "Aparelho", [{ v: 5500, t: "🚿 Chuveiro" }, { v: 150, t: "🧊 Geladeira" }, { v: 100, t: "📺 TV" }, { v: 1000, t: "🧺 Ferro de passar" }], 5500, function (v) { P.set(v); desenha(); });
          var P = R.slider(ctr, "Potência", 10, 7500, 10, 5500, function (v) { return R.fmt(v, 0) + " W"; }, desenha);
          var h = R.slider(ctr, "Tempo ligado por dia", 0.25, 24, 0.25, 0.5, function (v) { return v < 1 ? R.fmt(v * 60, 0) + " min" : R.fmt(v, 2) + " h"; }, desenha);
          var tar = R.slider(ctr, "Tarifa", 0.5, 1.5, 0.05, 0.9, function (v) { return "R$ " + v.toFixed(2).replace(".", ",") + " por kWh"; }, desenha);
          var L = R.leituras(); var av = R.aviso();
          var giro = 0, kw = 0;
          function desenha() {
            kw = P.v / 1000;
            var kwhDia = kw * h.v, kwhMes = kwhDia * 30, custo = kwhMes * tar.v;
            tK.textContent = R.fmt(kwhMes, 1); tR.textContent = "R$ " + custo.toFixed(2).replace(".", ",");
            L.set("d", "Energia por dia", R.fmt(kwhDia, 2) + " kWh");
            L.set("m", "Energia em 30 dias", R.fmt(kwhMes, 1) + " kWh");
            L.set("c", "Custo no mês", "R$ " + custo.toFixed(2).replace(".", ","));
            av.set("Conta: " + R.fmt(kw, 2) + " kW × " + R.fmt(h.v, 2) + " h × 30 dias = " + R.fmt(kwhMes, 1) + " kWh.", "neutro");
          }
          R.animar(function (dt) { giro = (giro + kw * 30 * dt) % 144; marca.setAttribute("x", 70 + giro); });
          desenha();
        },

      { tema: "Eletrostática", p: "Num dia seco você leva choque ao tocar a maçaneta. Isso acontece porque:", ops: ["a maçaneta está ligada na tomada", "seu corpo acumulou carga por atrito e descarregou no metal", "o metal produz eletricidade", "a umidade é alta"], c: 1, exp: "O atrito (roupa, tapete) eletriza o corpo; o metal é bom condutor e a carga escoa de uma vez." },
      { tema: "Lei de Ohm", p: "Um resistor de 10 Ω percorrido por 2 A está submetido a uma tensão de:", ops: ["5 V", "12 V", "20 V", "0,2 V"], c: 2, exp: "U = R · i = 10 · 2 = 20 V." },
      { tema: "Potência", p: "Uma lâmpada tem a inscrição 60 W – 120 V. A corrente que passa por ela é:", ops: ["2 A", "0,5 A", "7 200 A", "180 A"], c: 1, exp: "i = P / U = 60 / 120 = 0,5 A." },
      { tema: "Consumo", p: "Qual consome mais energia em um mês: uma TV de 100 W ligada 5 h por dia ou um chuveiro de 5 000 W ligado 6 minutos por dia?", ops: ["A TV", "O chuveiro", "Empatam: os dois gastam 15 kWh", "Nenhum dos dois gasta energia"], c: 2, exp: "TV: 0,1 kW × 5 h × 30 = 15 kWh. Chuveiro: 5 kW × 0,1 h × 30 = 15 kWh. Empate!" },
      { tema: "Magnetismo", p: "Ao quebrar um ímã ao meio, obtemos:", ops: ["um polo norte e um polo sul separados", "dois ímãs, cada um com norte e sul", "dois pedaços sem magnetismo", "dois polos norte"], c: 1, exp: "Os polos são inseparáveis: cada pedaço vira um ímã completo." },
      { tema: "Eletromagnetismo", p: "Um fio percorrido por corrente elétrica perto de uma bússola faz a agulha se mexer. Isso mostra que:", ops: ["a bússola está quebrada", "corrente elétrica cria campo magnético", "o fio é um ímã natural", "a Terra mudou de polo"], c: 1, exp: "É a experiência de Oersted: cargas em movimento geram campo magnético." },
      { tema: "Ondas eletromagnéticas", p: "Qual destas radiações é ionizante?", ops: ["Ondas de rádio", "Micro-ondas", "Raios X", "Infravermelho"], c: 2, exp: "Raios X (e gama, e parte do UV) têm energia por fóton suficiente para arrancar elétrons dos átomos." },
      { tema: "Física moderna", p: "No modelo de Bohr, um átomo emite luz quando o elétron:", ops: ["é arrancado do átomo", "salta de um nível de energia mais alto para um mais baixo", "fica parado", "entra no núcleo"], c: 1, exp: "Ao descer de nível, o elétron libera a diferença de energia como um fóton de frequência bem definida." },
      { tema: "Física moderna", p: "A meia-vida de um material radioativo é 8 dias. De 100 g, depois de 24 dias restam:", ops: ["50 g", "25 g", "12,5 g", "0 g"], c: 2, exp: "24 dias = 3 meias-vidas: 100 → 50 → 25 → 12,5 g." }
    ]
  });
})();
